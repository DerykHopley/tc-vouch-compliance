name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # full lane: nightly on main
  workflow_dispatch:  # full lane by hand: gh workflow run ci.yml

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - name: ruff format, checked (#243)
        run: uv run ruff format --check
      - name: mypy over src/ and tests/ (#129)
        run: uv run mypy
      - name: pytest, no API key, sockets disabled
        run: env -u OPENROUTER_API_KEY uv run pytest --disable-socket

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: design lint, every colour a token
        run: python3 -I -B scripts/design-lint.py frontend/src && python3 -I -B scripts/token-roles.py frontend/src
        working-directory: .
      # The dev command's real-server test needs the front-end deps installed above (the fast
      # lane, without them, skips it and runs the rest of the file).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: the dev command (scripts/dev.sh) with real servers, on spare ports
        run: >-
          uv sync --locked && env -u OPENROUTER_API_KEY uv run pytest tests/test_dev_command.py
          -k test_starts_both_servers_and_ctrl_c_stops_both
        working-directory: .

  database:
    # The integration tests that need Postgres (#33's database module, #35's spending guard,
    # #38's assessments and memory per user, #39's audit trail, #40's overview, #45's chat threads)
    # against a service container, on every PR and on main: it takes seconds. Cloud SQL runs
    # PostgreSQL 16. Every test that uses a Postgres fixture carries the `postgres` marker
    # (tests/conftest.py), so `-m postgres` picks a new one up with no list to keep (#259).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: every Postgres-backed test (the postgres marker) against Postgres, none skipped
        run: set -o pipefail; uv run pytest -m postgres -rs | tee "$RUNNER_TEMP/db.txt" && ! grep -q SKIPPED "$RUNNER_TEMP/db.txt"
        env:
          VOUCH_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres

  browser:
    # The browser check (frontend/e2e) against the container, as on Cloud Run, on the fake model.
    # Fast lane (a PR): Chromium. Full lane (main, nightly, by hand): Chromium and Firefox.
    name: Browser check (${{ matrix.browser }})
    runs-on: ubuntu-latest
    # A ceiling, not the budget: a healthy run takes about 6.5 minutes (Chromium) and 8.5
    # (Firefox); the headroom lets a slow mirror on a cache miss cost time, not the run (#611).
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: docker build -t vouch:ci .
      - name: without a front-end build the container refuses to start
        run: |
          if out=$(docker run --rm -e VOUCH_AUTH_MODE=local --tmpfs /app/frontend/dist vouch:ci 2>&1); then
            echo "The container started without a front-end build."; exit 1
          fi
          echo "$out" | grep -F "no front-end build"
      - name: without the Clerk keys the container refuses to start, naming them
        run: |
          # timeout: a regression that starts the server must fail here, not hang the job
          if out=$(timeout 60 docker run --rm vouch:ci 2>&1); then
            echo "The container started in clerk mode without the Clerk keys."; exit 1
          fi
          for key in CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY CLERK_JWT_KEY; do
            echo "$out" | grep -F "$key"
          done
      - run: uv sync --locked
      # The browser from cache (#270): a download that stalled cancelled the Firefox job three times.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.browser }}-${{ hashFiles('frontend/e2e/uv.lock') }}
      # The browser's system packages from cache (#611): `install-deps` ran `apt-get update` and
      # downloaded from the Ubuntu mirrors every run, and a mirror DNS outage timed the step out
      # with no test run. The .debs it needs on this runner image are cached; the mirror is used
      # only on a miss, or when the cached set doesn't install.
      - name: key for the system packages' cache (runner image, Playwright, browser)
        id: apt-key
        run: |
          : "${ImageOS:?no ImageOS on this runner}" "${ImageVersion:?no ImageVersion on this runner}"
          version=$(uv run --locked --project frontend/e2e playwright --version | awk '{print $2}')
          echo "key=apt-debs-$ImageOS-$ImageVersion-playwright-$version-${{ matrix.browser }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: apt-cache
        with:
          path: ~/.cache/apt-debs
          key: ${{ steps.apt-key.outputs.key }}
      # Bounded by the step only: a `timeout` around apt killed uv but not apt, which kept the dpkg
      # lock, so its retry failed (#290). An apt that exits on its own frees the lock for the retry.
      - name: install the browser's system packages, from the cache or the mirror tried twice
        id: apt-install
        timeout-minutes: 8
        run: |
          debs=~/.cache/apt-debs
          e2e() { uv run --locked --project frontend/e2e playwright "$@"; }
          # What install-deps would install on this image, from apt's local lists (no network).
          pkgs=$(e2e install-deps --dry-run ${{ matrix.browser }} | sed -n 's/^  //p')
          if [ -z "$pkgs" ]; then e2e install-deps --dry-run ${{ matrix.browser }}; exit 0; fi
          echo "Missing system packages:" $pkgs
          mkdir -p "$debs/partial"
          apt_install() { sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$debs" "$@" $pkgs; }
          if [ "${{ steps.apt-cache.outputs.cache-hit }}" = true ] && apt_install --no-download; then
            echo "Installed from the cache, no download."
          else
            if [ "${{ steps.apt-cache.outputs.cache-hit }}" = true ]; then
              echo "::warning::the cached system packages didn't install; downloading from the mirror"
            fi
            # Once on the image's package lists, then once more after `apt-get update`: a mirror
            # failure, or lists older than the mirror, gets one retry.
            for attempt in 1 2; do
              if [ "$attempt" = 2 ]; then sudo apt-get update || true; fi
              if apt_install --download-only; then break; fi
              echo "::warning::system package download attempt $attempt failed"
              if [ "$attempt" = 2 ]; then exit 1; fi
            done
            apt_install --no-download
            sudo rm -rf "$debs/partial" "$debs/lock"
            sudo chown -R "$(id -u):$(id -g)" "$debs"
            if ls "$debs"/*.deb > /dev/null; then echo "save=true" >> "$GITHUB_OUTPUT"; fi
          fi
          e2e install-deps --dry-run ${{ matrix.browser }}  # exits non-zero if any are still missing
      - if: steps.apt-install.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/apt-debs
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}
      - name: download the browser, bounded and tried twice
        timeout-minutes: 7
        run: |
          for attempt in 1 2; do
            timeout --kill-after=10 180 uv run --locked --project frontend/e2e playwright install ${{ matrix.browser }} && exit 0
            echo "::warning::browser download attempt $attempt failed or timed out"
          done
          exit 1
      - run: frontend/e2e/run.sh --browser ${{ matrix.browser }}
        env:
          VOUCH_IMAGE: vouch:ci
          E2E_LOG_DIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.browser }}
          path: ${{ runner.temp }}/*.log

  main-red:
    # A red run on main (a push, the nightly full lane, or by hand) opens a Fix by itself (#241),
    # or comments on the one already open: main was red five hours unnoticed on 2026-11-06. Never
    # on a PR, never on a green run. GITHUB_TOKEN only: issues to write, the run's jobs to read.
    needs: [fast-lane, frontend, database, browser]
    # A needed job failed, or was cancelled by its own timeout; not when someone cancelled the run.
    if: >-
      !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
      && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    # Overlapping red runs (a push during the nightly lane) take turns, so the second finds the
    # first's issue and comments on it: one issue per red streak.
    concurrency:
      group: main-red
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: scripts/main-is-red.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
