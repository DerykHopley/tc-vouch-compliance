name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"  # full lane: nightly on main
  workflow_dispatch:  # full lane by hand: gh workflow run ci.yml

jobs:
  fast-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check
      - name: pytest, no API key, sockets disabled
        run: env -u OPENROUTER_API_KEY uv run pytest --disable-socket

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: design lint, every colour a token
        run: python3 -I -B scripts/design-lint.py frontend/src && python3 -I -B scripts/token-roles.py frontend/src
        working-directory: .
      # The dev command's real-server test needs the front-end deps installed above (the fast
      # lane, without them, skips it and runs the rest of the file).
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: the dev command (scripts/dev.sh) with real servers, on spare ports
        run: >-
          uv sync --locked && env -u OPENROUTER_API_KEY uv run pytest tests/test_dev_command.py
          -k test_starts_both_servers_and_ctrl_c_stops_both
        working-directory: .

  database:
    # The integration tests that need Postgres (#33's database module, #35's spending guard,
    # #38's assessments and memory per user, #39's audit trail, #40's overview, #45's chat threads)
    # against a service container, on every PR and on main: it takes seconds. Cloud SQL runs
    # PostgreSQL 16. Every file that uses VOUCH_TEST_DATABASE_URL belongs in the command below.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: the database module, spending guard, memory, audit trail, overview, chat and remediation items against Postgres, none skipped
        run: set -o pipefail; uv run pytest tests/test_database.py tests/test_spending.py tests/test_memory.py tests/test_dossier.py tests/test_audit.py tests/test_chat_agent.py tests/test_chat_evidence.py tests/test_remediation.py tests/test_report.py -rs | tee "$RUNNER_TEMP/db.txt" && ! grep -q SKIPPED "$RUNNER_TEMP/db.txt"
        env:
          VOUCH_TEST_DATABASE_URL: postgresql://postgres:ci-only@127.0.0.1:5432/postgres

  browser:
    # The browser check (frontend/e2e) against the container, as on Cloud Run, on the fake model.
    # Fast lane (a PR): Chromium. Full lane (main, nightly, by hand): Chromium and Firefox.
    name: Browser check (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ github.event_name == 'pull_request' && fromJSON('["chromium"]') || fromJSON('["chromium", "firefox"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: docker build -t vouch:ci .
      - name: without a front-end build the container refuses to start
        run: |
          if out=$(docker run --rm -e VOUCH_AUTH_MODE=local --tmpfs /app/frontend/dist vouch:ci 2>&1); then
            echo "The container started without a front-end build."; exit 1
          fi
          echo "$out" | grep -F "no front-end build"
      - name: without the Clerk keys the container refuses to start, naming them
        run: |
          # timeout: a regression that starts the server must fail here, not hang the job
          if out=$(timeout 60 docker run --rm vouch:ci 2>&1); then
            echo "The container started in clerk mode without the Clerk keys."; exit 1
          fi
          for key in CLERK_SECRET_KEY CLERK_PUBLISHABLE_KEY CLERK_JWT_KEY; do
            echo "$out" | grep -F "$key"
          done
      - run: uv sync --locked
      - run: uv run --locked --project frontend/e2e playwright install --with-deps ${{ matrix.browser }}
      - run: frontend/e2e/run.sh --browser ${{ matrix.browser }}
        env:
          VOUCH_IMAGE: vouch:ci
          E2E_LOG_DIR: ${{ runner.temp }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-logs-${{ matrix.browser }}
          path: ${{ runner.temp }}/*.log
