<title>Vouch UI Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  PROTOTYPE, throwaway (branch prototype/ui, never merged to main).
  Question: what should Vouch's audit-prep screen look like?
  Plan: three structurally different variants of the prep screen (A Counsel: chat-first,
  B Working paper: control workpaper, C Docket: one control at a time), switchable with the
  bottom bar or ?variant= / #variant-a. Report and Developer pages are shared, one design each.
  All data is invented (Nordlicht Komponenten GmbH, Alpenwerk Präzision GmbH) except the ISA
  question and requirement texts, which are VDA ISA 6 (ENX Association, CC BY-ND 4.0), unmodified.
  State is in memory only. Nothing calls a model.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=Libre+Caslon+Display&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: an auditor's working paper. Cool grey paper, white sheets, navy ink, one oxblood accent for the actions that sign something off. */
:root{
  --paper:#EEF1F5; --sheet:#FFFFFF; --ink:#152132; --muted:#566377; --rule:#D3D9E2; --navy:#1E3A5F; --sign:#7A2232;
  --found:#2D7A4E; --partial:#A8701A; --gap:#B03A3A; --na:#748194; --run:#3D6FA8;
  --found-bg:#E6F2EA; --partial-bg:#F8EEDC; --gap-bg:#F7E3E3; --na-bg:#ECEFF3; --run-bg:#E3ECF6;
  --inverse:#152132; --inverse-fg:#F4F6F9; --band:#152132; --band-fg:#F1F3F6; --brass:#7A2232; --check-a:transparent; --check-b:transparent;
  --f-display:"IBM Plex Serif", Georgia, "Times New Roman", serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131A; --sheet:#151C26; --ink:#E4E9F0; --muted:#98A4B4; --rule:#2A3443; --navy:#8EB0DA; --sign:#E07A88;
  --found:#62BE88; --partial:#E2AA4E; --gap:#E57575; --na:#8E99A8; --run:#7FAAE0;
  --found-bg:#16291F; --partial-bg:#2E2414; --gap-bg:#2F1A1B; --na-bg:#1D242E; --run-bg:#172434;
  --inverse:#E4E9F0; --inverse-fg:#0E131A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E131A; --sheet:#151C26; --ink:#E4E9F0; --muted:#98A4B4; --rule:#2A3443; --navy:#8EB0DA; --sign:#E07A88;
  --found:#62BE88; --partial:#E2AA4E; --gap:#E57575; --na:#8E99A8; --run:#7FAAE0;
  --found-bg:#16291F; --partial-bg:#2E2414; --gap-bg:#2F1A1B; --na-bg:#1D242E; --run-bg:#172434;
  --inverse:#E4E9F0; --inverse-fg:#0E131A; color-scheme:dark}
/* Style "Tailored" (mood board: glen-check greys, navy tie, brass detail; dark mode from the lamp page: near-black with champagne). */
:root[data-style="tailored"]{
  --paper:#E8E7E3; --sheet:#F7F7F5; --ink:#1B1D21; --muted:#62656B; --rule:#D0CEC8; --navy:#1F3B6E; --sign:#1B1D21; --brass:#A8834A;
  --found:#3F7A55; --partial:#A06E22; --gap:#A4433F; --na:#7A7C80; --run:#1F3B6E;
  --found-bg:#E2EDE5; --partial-bg:#F3EAD9; --gap-bg:#F3E2E0; --na-bg:#E4E3DF; --run-bg:#E1E6EF;
  --check-a:rgb(27 29 33 / .07); --check-b:rgb(31 59 110 / .08); --band:#1B1D21; --band-fg:#F2F1EE;
  --f-display:"Libre Caslon Display", "Libre Caslon Text", Georgia, serif; --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;}
@media (prefers-color-scheme: dark){:root[data-style="tailored"]:not([data-theme="light"]){
  --paper:#0D0D0E; --sheet:#171718; --ink:#ECE6DC; --muted:#9C978E; --rule:#2C2B29; --navy:#A9BEE6; --sign:#E3CB9F; --brass:#E2C391;
  --found:#7DBE93; --partial:#E0B064; --gap:#E08A80; --na:#8F8C86; --run:#A9BEE6;
  --found-bg:#18241C; --partial-bg:#2A2216; --gap-bg:#2B1B19; --na-bg:#1E1E1F; --run-bg:#1A2030;
  --check-a:rgb(236 230 220 / .05); --check-b:rgb(227 203 159 / .06); --band:#222224; --band-fg:#ECE6DC; color-scheme:dark}}
:root[data-style="tailored"][data-theme="dark"]{
  --paper:#0D0D0E; --sheet:#171718; --ink:#ECE6DC; --muted:#9C978E; --rule:#2C2B29; --navy:#A9BEE6; --sign:#E3CB9F; --brass:#E2C391;
  --found:#7DBE93; --partial:#E0B064; --gap:#E08A80; --na:#8F8C86; --run:#A9BEE6;
  --found-bg:#18241C; --partial-bg:#2A2216; --gap-bg:#2B1B19; --na-bg:#1E1E1F; --run-bg:#1A2030;
  --check-a:rgb(236 230 220 / .05); --check-b:rgb(227 203 159 / .06); --band:#222224; --band-fg:#ECE6DC; color-scheme:dark}
[data-style="tailored"] h1,[data-style="tailored"] h2{font-weight:400;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
[data-style="tailored"] .brand b{font-family:var(--f-display);font-weight:400;text-transform:uppercase;letter-spacing:.08em}
[data-style="tailored"] .brand b::after{content:"";display:inline-block;width:7px;height:7px;margin-left:6px;background:var(--brass);transform:rotate(45deg) translateY(-2px)}
[data-style="tailored"] .top::after{content:"";display:block;height:6px;background:
  repeating-linear-gradient(90deg,var(--check-a) 0 2px,transparent 2px 4px,var(--check-b) 4px 5px,transparent 5px 12px),
  repeating-linear-gradient(0deg,var(--check-a) 0 2px,transparent 2px 4px,var(--check-b) 4px 5px,transparent 5px 12px)}
[data-style="tailored"] .nav{background:var(--paper);border-radius:999px;padding:3px}
[data-style="tailored"] .nav button{border-radius:999px}
[data-style="tailored"] .nav button[aria-current="page"]{background:var(--sheet);box-shadow:inset 0 -2px 0 var(--brass)}
[data-style="tailored"] .btn{border-radius:999px;padding:7px 16px}
[data-style="tailored"] .btn-ghost{padding:4px 8px}
[data-style="tailored"] .btn-primary{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
[data-style="tailored"] .sheet{border-radius:14px}
[data-style="tailored"] .prof select{border-radius:999px;padding:5px 12px}
[data-style="tailored"] .quote{border-left-color:var(--brass);font-family:"IBM Plex Serif", Georgia, serif}
[data-style="tailored"] .msg.user{background:var(--ink);color:var(--sheet)}
[data-style="tailored"] .B-head{border-bottom-color:var(--brass)}
[data-style="tailored"] .C-narr{border-left-color:var(--brass)}
[data-style="tailored"] .C-q{font-family:"IBM Plex Serif", Georgia, serif;font-weight:500}
[data-style="tailored"] .kpis div b{font-family:var(--f-display);font-weight:400}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font:14px/1.5 var(--f-body);margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0}
.mono{font-family:var(--f-mono)}
.muted{color:var(--muted)}
.lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.wrap{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}

/* top bar (shared) */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--sheet);border-bottom:1px solid var(--rule)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px;padding-block:10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.nav{display:flex;gap:2px}
.nav button{background:none;border:0;padding:6px 10px;border-radius:4px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{color:var(--ink);background:var(--paper)}
.prof{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.prof select{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:5px 8px;max-width:100%}
.ctx{font-size:12px;color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.v-found{color:var(--found);background:var(--found-bg)}
.v-partial{color:var(--partial);background:var(--partial-bg)}
.v-gap{color:var(--gap);background:var(--gap-bg)}
.v-na,.v-none{color:var(--na);background:var(--na-bg)}
.v-run{color:var(--run);background:var(--run-bg)}
.st{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:1px 6px;border-radius:3px;border:1px solid var(--rule);color:var(--muted);white-space:nowrap}
.st-accepted{color:var(--found);border-color:var(--found)}
.st-rejected{color:var(--sign);border-color:var(--sign)}
.st-proposed{color:var(--run);border-color:var(--run)}
.kind{font-size:11px;font-family:var(--f-mono);padding:0 5px;border-radius:3px;border:1px dashed var(--rule);color:var(--muted)}
.kind-implemented{border-style:solid;color:var(--navy);border-color:var(--navy)}
.flag{font-size:11px;font-weight:600;color:var(--partial)}

/* buttons */
.btn{border:1px solid var(--rule);background:var(--sheet);padding:6px 12px;border-radius:4px;font-weight:500}
.btn:hover{border-color:var(--navy)}
.btn-primary{background:var(--navy);color:var(--sheet);border-color:var(--navy)}
.btn-sign{background:var(--sign);color:var(--sheet);border-color:var(--sign)}
.btn-ghost{border-color:transparent;background:none;color:var(--navy);padding:4px 6px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* shared pieces */
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:6px}
.quote{border-left:3px solid var(--rule);margin:6px 0 0;padding:4px 10px;font-family:var(--f-display);font-style:italic;color:var(--ink)}
.cite-meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:2px}
.ok{color:var(--found)} .bad{color:var(--gap)}
.trace{font-family:var(--f-mono);font-size:12px;display:grid;gap:3px}
.trace .t{display:grid;grid-template-columns:16px 1fr;gap:6px;align-items:start}
.trace .t i{font-style:normal;color:var(--muted)}
.trace .t b{font-weight:500;color:var(--navy)}
.trace .t.warn b{color:var(--partial)}
.trace .t.branch b{color:var(--sign)}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--na-bg)}
.bar span{display:block;height:100%}
textarea,input[type=text]{background:var(--sheet);border:1px solid var(--rule);border-radius:4px;padding:6px 8px;width:100%}
.disclaimer{font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:8px}

/* ===== Variant A: Counsel (chat-first) ===== */
.A{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;padding-block:16px;max-width:1280px;margin:0 auto}
.A-chat{display:flex;flex-direction:column;min-height:calc(100vh - 150px);min-width:0}
.A-msgs{flex:1;display:grid;gap:14px;align-content:start;padding-bottom:12px}
.msg{max-width:760px;min-width:0}
.msg.user{justify-self:end;background:var(--navy);color:var(--sheet);padding:8px 12px;border-radius:10px 10px 2px 10px}
.msg.vouch .who{font-family:var(--f-display);font-weight:600;font-size:13px;margin-bottom:2px}
.msg.vouch .body{background:var(--sheet);border:1px solid var(--rule);border-radius:2px 10px 10px 10px;padding:10px 14px}
.A details{margin-top:8px;border-top:1px solid var(--rule);padding-top:6px}
.A summary{cursor:pointer;font-size:12px;color:var(--muted)}
.A-req{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin-top:8px;font-size:13px}
.A-review{margin-top:10px;border:1px solid var(--sign);border-radius:6px;padding:10px;display:grid;gap:8px}
.A-input{position:sticky;bottom:0;background:var(--paper);padding:10px 0 60px;display:grid;gap:8px}
.A-input form{display:flex;gap:8px}
.sugg{display:flex;flex-wrap:wrap;gap:6px}
.sugg button{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:3px 10px;font-size:12px}
.A-panel{position:sticky;top:70px;align-self:start;display:grid;gap:12px}
.A-panel .sheet{padding:12px}
.A-ctl{display:grid;grid-template-columns:44px 1fr auto;gap:6px;align-items:center;padding:4px 0;border-top:1px solid var(--rule);font-size:13px;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;width:100%}
.A-ctl:hover{background:var(--paper)}

/* ===== Variant B: Working paper ===== */
.B{display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:0;min-height:calc(100vh - 54px)}
.B-index{border-right:1px solid var(--rule);background:var(--sheet);padding:12px 0;overflow:auto}
.B-index h3{font-family:var(--f-body);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:10px 14px 4px}
.B-row{display:grid;grid-template-columns:40px 1fr;gap:2px 8px;width:100%;text-align:left;background:none;border:0;border-left:3px solid transparent;padding:6px 12px;font-size:13px}
.B-row[aria-current="true"]{background:var(--paper);border-left-color:var(--navy)}
.B-row .q{grid-column:2;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.B-paper{padding:20px 24px 90px;min-width:0}
.B-head{display:grid;gap:6px;border-bottom:2px solid var(--ink);padding-bottom:12px;margin-bottom:12px}
.B-head .meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--muted)}
.B-tablewrap{overflow-x:auto}
.B-table{width:100%;border-collapse:collapse;font-size:13px;min-width:640px}
.B-table th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding:6px 8px;font-weight:600}
.B-table td{border-bottom:1px solid var(--rule);padding:8px;vertical-align:top}
.B-table tr.col-o td:first-child{color:var(--sign);font-weight:600}
.B-table .rq{max-width:52ch}
.B-review{position:sticky;bottom:0;background:var(--sheet);border:1px solid var(--rule);border-top:2px solid var(--sign);padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}
.B-review textarea{flex:1 1 240px;min-height:36px}
.B-rail{border-left:1px solid var(--rule);background:var(--sheet);padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.B-rail .log{flex:1;overflow:auto;display:grid;gap:8px;align-content:start;font-size:13px}
.B-rail .log .m{padding:6px 8px;border-radius:4px;background:var(--paper)}
.B-rail .log .m.user{background:var(--run-bg)}

/* ===== Variant C: Docket ===== */
.C{max-width:980px;margin:0 auto;padding-block:16px 100px;display:grid;gap:16px}
.C-strip{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.C-step{border:0;border-radius:3px;padding:8px 0 6px;font-family:var(--f-mono);font-size:11px;text-align:center;background:var(--na-bg);color:var(--muted);position:relative}
.C-step.v-found{background:var(--found);color:var(--sheet)}
.C-step.v-partial{background:var(--partial);color:var(--sheet)}
.C-step.v-gap{background:var(--gap);color:var(--sheet)}
.C-step.v-run{background:var(--run);color:var(--sheet)}
.C-step.proposed{outline:2px dashed var(--run);outline-offset:-2px}
.C-step.rejected{outline:2px solid var(--sign);outline-offset:-2px}
.C-step[aria-current="true"]::after{content:"";position:absolute;left:50%;bottom:-8px;border:6px solid transparent;border-top-color:var(--ink);transform:translateX(-50%)}
.C-areas{display:grid;grid-template-columns:3fr 1fr 3fr 5fr;gap:4px;font-size:11px;color:var(--muted)}
.C-card{padding:20px 24px;display:grid;gap:14px}
.C-q{font-family:var(--f-display);font-size:24px;line-height:1.25}
.C-narr{display:grid;gap:6px;border-left:3px solid var(--navy);padding-left:12px}
.C-narr p{margin:0}
.C-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.C-col h3{font-family:var(--f-body);font-size:13px;margin-bottom:6px}
.C-item{border-top:1px solid var(--rule);padding:8px 0;display:grid;gap:4px;font-size:13px}
.C-decide{position:sticky;bottom:0;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;box-shadow:0 -6px 18px rgb(0 0 0 / .06);margin-bottom:56px}
.C-tray{border-top:1px solid var(--rule);padding-top:10px}

/* ===== Variant D: Dossier (long overview page, after the Atlas layout) ===== */
.D{max-width:1180px;margin:0 auto;padding-block:20px 110px;display:grid;gap:36px}
.D-pill{display:inline-block;background:var(--na-bg);color:var(--muted);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:600}
.D-hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:stretch}
.D-hero h1{font-size:clamp(30px,4.2vw,50px);margin:10px 0 14px}
.D-hero p{max-width:52ch;margin:0 0 16px;color:var(--muted)}
.D-hero .next{display:flex;flex-wrap:wrap;gap:8px}
.D-chat{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.D-chat .log{display:grid;gap:8px;font-size:13px;max-height:280px;overflow:auto;align-content:start;flex:1}
.D-chat .m{background:var(--paper);border-radius:10px;padding:8px 10px}
.D-chat .m.user{background:var(--ink);color:var(--sheet);justify-self:end}
.D-band{background:var(--band);color:var(--band-fg);border-radius:16px;padding:32px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:28px}
.D-band h2{font-size:30px;margin-top:8px}
.D-band p{opacity:.8;margin:0;max-width:56ch}
.D-band .D-pill{background:color-mix(in srgb, var(--band-fg) 14%, transparent);color:var(--band-fg)}
.D-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;grid-column:1/-1}
.D-tile{border:1px solid color-mix(in srgb, var(--band-fg) 18%, transparent);border-radius:12px;padding:14px 16px}
.D-tile b{display:block;font-family:var(--f-display);font-weight:400;font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
.D-tile span{font-size:12px;opacity:.75}
.D-head{text-align:center;display:grid;gap:8px;justify-items:center}
.D-head h2{font-size:30px}
.D-head p{margin:0;color:var(--muted);max-width:60ch}
.D-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.D-card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:10px;text-align:left;display:grid;gap:8px;align-content:start}
.D-card[aria-current="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.D-card .face{background:var(--paper);border-radius:10px;height:74px;display:flex;align-items:flex-end;justify-content:space-between;padding:8px 10px;border-bottom:4px solid var(--na)}
.D-card .face b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1}
.D-card .face.v-found{border-bottom-color:var(--found)} .D-card .face.v-partial{border-bottom-color:var(--partial)} .D-card .face.v-gap{border-bottom-color:var(--gap)} .D-card .face.v-run{border-bottom-color:var(--run)}
.D-card .q{font-size:13px;line-height:1.4}
.D-card .sub{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.D-detail{background:var(--sheet);border:1px solid var(--rule);border-radius:16px;padding:22px;display:grid;gap:14px}
.D-reqs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.D-req{border:1px solid var(--rule);border-radius:12px;padding:12px;display:grid;gap:6px;align-content:start;font-size:13px}
.D-quotes{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.D-quote{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;display:grid;gap:10px;align-content:space-between}
.D-quote .mark{font-family:var(--f-display);font-size:40px;line-height:.6;color:var(--brass)}
.D-quote p{margin:0;font-family:"IBM Plex Serif", Georgia, serif;font-size:14px}
.D-quote footer{font-size:12px;color:var(--muted);display:grid;gap:2px}
.D-ask{background:var(--band);color:var(--band-fg);border-radius:16px;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:24px;align-items:center}
.D-ask h2{font-size:28px}
.D-ask p{opacity:.8;margin:6px 0 0}
.D-ask form{display:grid;gap:8px}
.D-ask input{background:color-mix(in srgb, var(--band-fg) 8%, transparent);border-color:color-mix(in srgb, var(--band-fg) 22%, transparent);color:var(--band-fg);border-radius:10px;padding:10px 12px}
.D-ask .btn-primary{background:var(--band-fg);color:var(--band);border-color:var(--band-fg);justify-self:start}
.D-foot{display:grid;grid-template-columns:2fr 1fr 1fr;gap:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px}
.D-foot b{display:block;color:var(--ink);font-size:13px;margin-bottom:4px}

/* ===== Report and Developer (shared) ===== */
.doc{max-width:900px;margin:16px auto 90px;padding:28px 32px;display:grid;gap:18px}
.doc table{width:100%;border-collapse:collapse;font-size:13px}
.doc th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--ink);padding:6px 8px}
.doc td{border-bottom:1px solid var(--rule);padding:7px 8px;vertical-align:top}
.tw{overflow-x:auto}
.kpis{display:flex;flex-wrap:wrap;gap:24px}
.kpis div b{display:block;font-family:var(--f-display);font-size:26px;font-variant-numeric:tabular-nums}
.devbanner{background:var(--partial-bg);color:var(--partial);padding:6px 10px;border-radius:4px;font-size:13px;font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ===== Prototype switcher (not part of the design) ===== */
.proto{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:50;display:flex;align-items:center;gap:4px;background:#111;color:#fff;border-radius:999px;padding:5px 6px;box-shadow:0 6px 24px rgb(0 0 0 / .35);font:500 13px/1 var(--f-mono);max-width:calc(100vw - 24px)}
.proto button{background:#2a2a2a;color:#fff;border:0;border-radius:999px;padding:7px 11px;font:inherit}
.proto button:hover{background:#444}
.proto .cur{padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pane{position:fixed;right:max(12px, env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:49;width:min(460px, calc(100vw - 24px));max-height:60vh;overflow:auto;background:#111;color:#eee;border-radius:8px;padding:12px 14px;font:12px/1.45 var(--f-mono);box-shadow:0 6px 24px rgb(0 0 0 / .35)}
.pane h4{margin:0 0 6px;font:600 12px var(--f-mono);color:#fff}
.pane ol{margin:0;padding-left:18px;display:grid;gap:6px;font-family:var(--f-body);font-size:13px}
.pane pre{margin:0;white-space:pre-wrap;word-break:break-word}

@media (max-width: 1000px){
  .A{grid-template-columns:1fr}
  .A-panel{position:static;order:-1}
  .B{grid-template-columns:1fr}
  .B-index{border-right:0;border-bottom:1px solid var(--rule);max-height:260px}
  .B-rail{border-left:0;border-top:1px solid var(--rule)}
  .B-paper{padding:16px 0 90px}
  .C-cols{grid-template-columns:1fr}
  .C-strip{grid-template-columns:repeat(6,minmax(0,1fr))}
  .C-areas{display:none}
  .doc{padding:20px 16px}
  .D-hero,.D-band,.D-ask{grid-template-columns:1fr}
  .D-band,.D-ask{padding:22px}
  .D-foot{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

orting exists.", "Different reporting channels according to perceived severity (i.e., real time communication for significant events / emergencies in addition to asynchronous mechanisms such as tickets or email). are available", "Employees are obligated and trained to report relevant events.", "Security event reports can also be submitted by external parties. The following aspects are considered:\n  - Availability and communication of a security event report channel for external parties,\n  -  Timely processing of security event reports from external parties.", "Mechanism to, and information how to, report incidents is accessible by all relevant reporters.", "A feedback procedure to reporters is established."], "high": [], "iso": "A.5.24, A.6.8"}, "1.6.2": {"q": "To what extent are reported security events managed?", "must": ["Reported events are processed without undue delay.", "An adequate reaction to reported security events is ensured.", "Lessons learned are incorporated into continuous improvement."], "should": ["During processing, reported events are categorized (e.g. by responsibility into personnel, physical and cyber), qualified (e.g., not security relevant, observation, suggested security improvement, security vulnerability, security incident) and prioritized (e.g., low, moderate, severe, critical).", "Responsibilities for handling of events based on their category are defined and assigned. The following aspects are considered:\n  - Coordination of incidents and vulnerabilities across multiple categories,\n  - Qualification and resources,\n  - Communication methods based on type and priority (e.g., non-time-critical communication, time-critical communication, emergency communication),\n  - Absence-management.", "A strategy for reporting potentially criminal aspects of security incidents to relevant authorities when necessary or appropriate. (C, I, A)."], "high": ["Maximum response times based on class, category and severity are defined. (C, I, A)", "Events rsonalized user accounts are used.", "The use of “shared accounts” is regulated (e.g., restricted to cases where traceability of actions is dispensable).", "User accounts are disabled immediately after the user has resigned from or left the organization (e.g., upon termination of the employment contract).", "User accounts are regularly reviewed.", "The login information is provided to the user in a secure manner.", "A policy for the handling of login information is defined and implemented. The following aspects are considered:\n  - No disclosure of login information, not even to persons of authority, within the limits of applicable law,\n  - No writing down or unencrypted storing of login information,\n  - Immediate changing of login information whenever potential compromising is suspected,\n  - No use of identical login information for business and non-business purposes,\n  - Changing of temporary or initial login information following the 1st login,    \n  - Requirements for the quality of authentication information (e.g., length of password, types of characters to be used)."], "should": ["A basic user account with minimum access rights and functionalities is existent and used.", "Default accounts and passwords pre-configured by manufacturers are disabled (e.g., by blocking or changing of password).", "User accounts are created or authorized by the responsible body.", "Creating user accounts is subject to an approval process (four-eyes principle).", "User accounts of service providers are disabled upon completion of their task.", "Deadlines for disabling and deleting user accounts are defined.", "The use of default passwords is technically prevented.", "Where strong authentication is applied, the use of the medium (e.g., ownership factor) is secure.", "User accounts are reviewed at regular intervals. This also includes user accounts in customers' IT systems.", "Interactive login for service accounts (technical accounts) is technically prevented."], "high": [], "is ollowing aspects are considered: \n  - Recovery Point Objective (RPO),\n  - Recovery Time Objective (RTO).\n  - Required resources for recovery (considering capacity and performance incl. personnel and hardware),\n  - Avoidance of overload scenarios during recovery,\n  - Appropriate spatial redundancy (e.g., separate room, separate fire  section, separate data center, separate site)."], "iso": "A.8.13"}};

  en:{found:'Evidenced', partial:'Partly evidenced', gap:'Not evidenced', na:'Not applicable', none:'Not assessed', run:'Assessing'},
  de:{found:'Nachgewiesen', partial:'Teilweise nachgewiesen', gap:'Nicht nachgewiesen', na:'Nicht anwendbar', none:'Nicht bewertet', run:'Wird bewertet'}

const vl = v => L[lang()][v] || v;

function reqList(cid, p=S.profile) {
  const isa = ISA[cid], prof = PROFILES[p], out = [];
  isa.must.forEach((t,i)=>out.push({id:'M'+(i+1), col:'M', text:t}));
  isa.should.forEach((t,i)=>out.push({id:'S'+(i+1), col:'S', text:t}));
  if (prof.protection !== 'normal') isa.high.forEach((t,i)=>out.push({id:'H'+(i+1), col:'H', text:t}));
  if (OVERLAY[p]?.[cid]) out.push({id:'O1', col:'O', text:OVERLAY[p][cid]});
  return out.map(r => ({...r, na: prof.na[cid+':'+r.id] || null}));
}
function rollup(cid, reqs, p=S.profile) {
  const decides = reqList(cid, p).filter(r => r.col !== 'S' && !r.na).map(r => reqs[r.id]?.v || 'gap');
  if (!decides.length) return 'na';
  if (decides.every(v=>v==='found')) return 'found';
  if (decides.every(v=>v==='gap')) return 'gap';
  return 'partial';
}

function docsOf(res){ const ids = new Set(); Object.values(res.reqs).forEach(r => (r.cites||[]).forEach(x => x && ids.add(x.doc+' v'+DOCS[x.doc].v))); return [...ids].join(', '); }
function traceFor(p, cid) {
  const res = RES[p][cid], isa = ISA[cid], prof = PROFILES[p], t = [];
  const n = reqList(cid,p);
  t.push({ico:'›', b:'load_control', txt:`${cid} · ${n.filter(r=>r.col==='M').length} must, ${n.filter(r=>r.col==='S').length} should`+(prof.protection!=='normal'?`, ${n.filter(r=>r.col==='H').length} high protection`:'')});
  if (OVERLAY[p]?.[cid]) t.push({ico:'⑂', b:'apply_overlays', txt:'AT NIS2 overlay adds 1 requirement (O1). Branch: overlay requirement', cls:'branch'});
  else t.push({ico:'›', b:'apply_overlays', txt:'no overlay requirement for this control'});
  const na = n.filter(r=>r.na); if (na.length) t.push({ico:'›', b:'profile', txt:`${na.map(r=>r.id).join(', ')} not applicable: ${na[0].na}`});
  res.tools.forEach(([tool,args,out]) => t.push({ico:'⚙', b:tool, txt:`${args} → ${out}`}));
  (res.guard||[]).forEach(g => t.push({ico:'⛨', b:'guard', txt:g, cls:'warn'}));
  (res.warn||[]).forEach(w => t.push({ico:'!', b:'evidence', txt:w, cls:'warn'}));
  const quotes = Object.values(res.reqs).flatMap(r=>(r.cites||[]).filter(Boolean)).length;
  t.push({ico:'✓', b:'check_quotes', txt:`${quotes} of ${quotes + ((res.guard||[]).some(g=>g.includes('dropped'))?1:0)} quotes found verbatim in the cited versions`});
  t.push({ico:'⚖', b:'judge', txt:`${n.length} requirements judged → ${L.en[rollup(cid,res.reqs,p)]}`});
  t.push({ico:'⏸', b:'interrupt', txt:'waiting for the compliance lead to review'});
  return t;
}
const stOf = (cid, p=S.profile) => S.st[p][cid] || {status:'none'};
function verdictOf(cid, p=S.profile){ const s = stOf(cid,p); return s.status==='running' ? 'run' : s.status==='none' ? 'none' : s.verdict; }
function counts(p=S.profile){
  const c = {accepted:0, rejected:0, proposed:0, none:0, found:0, partial:0, gap:0};
  ORDER.forEach(cid => { const s = stOf(cid,p); c[s.status==='running'?'none':s.status]++; if (s.status==='accepted') c[s.verdict]++; });
  return c;
}
function nextSuggestion(p=S.profile){
  const rej = ORDER.find(cid => stOf(cid,p).status==='rejected');
  const prop = ORDER.find(cid => stOf(cid,p).status==='proposed');
  const none = p==='aw' ? (stOf('1.6.2',p).status==='none' ? '1.6.2' : ORDER.find(cid => stOf(cid,p).status==='none')) : (stOf('5.1.1',p).status==='none' ? '5.1.1' : ORDER.find(cid => stOf(cid,p).status==='none'));
  return {rej, prop, none};
}

/* ---------- actions ---------- */
function run(cid) {
  const p = S.profile;
  if (S.running || !RES[p][cid]) { if(!RES[p][cid]) toastChat(p, lang()==='de' ? `Für ${cid} liegen im Prototyp keine Beispieldaten vor.` : `The prototype has no example data for ${cid} in this profile.`); return; }
  S.sel = cid;
  const steps = traceFor(p, cid);
  S.st[p][cid] = {status:'running', trace:[]};
  S.running = cid;
  S.chat[p].push({who:'user', text: (lang()==='de'?'Bitte ':'')+`Assess ${cid}`});
  S.chat[p].push({who:'vouch', kind:'assessment', cid});
  const delay = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 420;
  let i = 0;
  const tick = () => {
    if (i < steps.length) { S.st[p][cid].trace.push(steps[i++]); render(); setTimeout(tick, delay); return; }
    S.st[p][cid] = {status:'proposed', verdict:rollup(cid, RES[p][cid].reqs, p), trace:steps};
    S.running = null; S.runs.push({p, cid, at:today, tok:RES[p][cid].tok}); render();
  };
  render(); setTimeout(tick, delay);
}
function review(cid, decision) {
  const p = S.profile, s = stOf(cid,p), note = (document.getElementById('note-'+cid)?.value || '').trim();
  s.status = decision; s.review = {by:PROFILES[p].lead, at:today, note};
  S.trail.push({at:today, who:PROFILES[p].lead, p, cid, what:(decision==='accepted'?'Accepted':'Rejected')+' verdict: '+L.en[s.verdict], note, docs:docsOf(RES[p][cid]), model:'anthropic/claude-haiku-5.5', prompt:'assess-v0.3'});
  S.chat[p].push({who:'vouch', kind:'reviewed', cid, decision});
  render();
}

    let body = '';
    if (x.kind==='opening') body = openingText();
    else if (x.kind==='text') body = esc(x.text);
    else if (x.kind==='reviewed') body = x.decision==='accepted' ? `Noted. The verdict on <b class="mono">${x.cid}</b> is accepted and counts towards readiness. ${(() => {const n=nextSuggestion(); return n.none?`Next I suggest <b class="mono">${n.none}</b>.`:''})()}` : `Noted. The verdict on <b class="mono">${x.cid}</b> is rejected and does not count. I can assess it again once the evidence is updated.`;
    else if (x.kind==='assessment') {
      const s = stOf(x.cid), res = RES[p][x.cid];
      if (s.status==='running') body = `<div class="lbl">Assessing ${x.cid}</div>${traceHtml(s.trace)}`;
      else {
        const reqs = reqList(x.cid).filter(r=>r.col!=='S' || res.reqs[r.id]?.v!=='found');
        body = `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><b class="mono">${x.cid}</b> ${esc(ISA[x.cid].q)} ${chip(s.verdict)}</div>
          <p style="margin:8px 0 0">${esc(res.answer)}</p>
          <div class="A-req">${reqs.map(r => { const rr = res.reqs[r.id]||{v:'gap'}; const v = r.na?'na':rr.v;
            return `<span>${chip(v)}</span><div><span class="mono muted">${r.id}</span> ${esc(r.text.split('\n')[0].slice(0,150))}${r.text.length>150?'…':''}${rr.why?`<div class="muted" style="font-size:12px">${esc(rr.why)}</div>`:''}${(rr.cites||[]).map(citeHtml).join('')}${v==='gap'&&!r.na?remButton(x.cid,r.id):''}</div>`; }).join('')}</div>
          <details><summary>How Vouch reached this (${s.trace.length} steps)</summary>${traceHtml(s.trace)}</details>
          ${s.status==='proposed'?`<div class="A-review">${reviewControls(x.cid)}</div>`:`<div style="margin-top:8px">${reviewControls(x.cid)}</div>`}`;
      }
    }
    return `<div class="msg vouch"><div class="who">Vouch</div><div class="body">${body}</div></div>`;
  }).join('');
  const n = nextSuggestion();
  const sug = [n.prop&&`Review ${n.prop}`, n.rej&&`Assess ${n.rej} again`, n.none&&`Assess ${n.none}`, 'Which controls are still missing evidence?'].filter(Boolean);
  const panel = `<aside class="A-panel">
    <div class="sheet"><div class="lbl">Readiness</div><div style="margin-top:6px">${readinessBar()}</div></div>
    <div class="sheet"><div class="lbl" style="margin-bottom:4px">Controls</div>${AREAS.map(a=>`<div class="muted" style="font-size:12px;margin-top:6px">${a.name}</div>${a.ids.map(cid=>{const s=stOf(cid);return `<button class="A-ctl" data-act="${s.status==='none'||s.status==='rejected'?'run':'focus'}" data-cid="${cid}"><span class="mono">${cid}</span><span style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(ISA[cid].q.replace('To what extent ','').replace(/^(is|are) /,''))}</span>${s.status==='none'?'<span class="muted" style="font-size:12px">'+vl('none')+'</span>':chip(verdictOf(cid))}</button>`;}).join('')}`).join('')}</div>
  </aside>`;
  return `<div class="A wrap"><section class="A-chat"><div class="A-msgs" id="msgs">${m}</div>
    <div class="A-input"><div class="sugg">${sug.map(s=>`<button data-act="ask" data-text="${esc(s)}">${esc(s)}</button>`).join('')}</div>
    <form data-act="send"><input type="text" id="ask-a" placeholder="${lang()==='de'?'Frage an Vouch, z. B. „Bewerte 5.1.1“':'Ask Vouch, for example “Assess 5.1.1”'}" autocomplete="off"><button class="btn btn-primary">Send</button></form></div></section>${panel}</div>`;
}

/* ---------- Variant B: Working paper ---------- */
function VariantB(){
  const p = S.profile, cid = S.sel, s = stOf(cid), res = RES[p][cid], isa = ISA[cid];
  const idx = AREAS.map(a=>`<h3>${a.name}</h3>${a.ids.map(id=>{const st=stOf(id);return `<button class="B-row" data-act="sel" data-cid="${id}" aria-current="${id===cid}"><span class="mono">${id}</span><span style="display:flex;gap:6px;align-items:center;justify-content:space-between">${st.status==='none'?'<span class="muted" style="font-size:12px">'+vl('none')+'</span>':chip(verdictOf(id))}${st.status!=='none'&&st.status!=='running'?`<span class="st st-${st.status}">${st.status}</span>`:''}</span><span class="q">${esc(ISA[id].q)}</span></button>`;}).join('')}`).join('');
  let paper;
  const head = `<div class="B-head"><div class="lbl">Working paper · ${esc(PROFILES[p].company)}</div>
    <h2><span class="mono" style="font-weight:500">${cid}</span> ${esc(isa.q)}</h2>
    <div class="meta"><span>ISO 27001:2022 ${esc(isa.iso)}</span><span>Protection: ${PROFILES[p].protection}</span><span>Answer language: ${PROFILES[p].langLabel}</span>${s.status!=='none'&&s.status!=='running'?`<span>Verdict ${chip(s.verdict)}</span>`:''}</div></div>`;
  if (s.status==='none' || s.status==='running') {
    paper = head + (s.status==='running' ? `<div class="sheet" style="padding:12px"><div class="lbl">Assessing</div>${traceHtml(s.trace)}</div>`
      : `<div class="sheet" style="padding:16px;display:grid;gap:10px"><p style="margin:0">Not assessed yet. ${reqList(cid).length} requirements apply in this profile.</p><div><button class="btn btn-primary" data-act="run" data-cid="${cid}">Assess ${cid}</button></div></div>`)
      + `<div class="B-tablewrap" style="margin-top:12px"><table class="B-table"><thead><tr><th>Req.</th><th>Requirement (VDA ISA)</th></tr></thead><tbody>${reqList(cid).map(r=>`<tr class="col-${r.col.toLowerCase()}"><td class="mono">${r.id}<div class="muted" style="font-size:11px">${COLNAME[r.col]}</div></td><td class="rq">${esc(r.text)}</td></tr>`).join('')}</tbody></table></div>`;
  } else {
    paper = head + `<p style="margin:0 0 12px;max-width:72ch">${esc(res.answer)}</p>
      <div class="B-tablewrap"><table class="B-table"><thead><tr><th>Req.</th><th>Requirement (VDA ISA)</th><th>Verdict</th><th>Evidence (exact quotes)</th></tr></thead><tbody>
      ${reqList(cid).map(r=>{const rr=res.reqs[r.id]||{v:'gap'}; const v=r.na?'na':rr.v; return `<tr class="col-${r.col.toLowerCase()}"><td class="mono">${r.id}<div class="muted" style="font-size:11px;font-family:var(--f-body)">${COLNAME[r.col]}</div></td>
        <td class="rq">${esc(r.text)}</td><td>${chip(v)}${rr.stale?'<div class="flag">stale evidence</div>':''}</td>
        <td style="min-width:240px">${r.na?`<span class="muted">${esc(r.na)}</span>`:''}${rr.why?`<div class="muted" style="font-size:12px">${esc(rr.why)}</div>`:''}${(rr.cites||[]).map(citeHtml).join('')}${v==='gap'&&!r.na?remButton(cid,r.id):''}</td></tr>`;}).join('')}
      </tbody></table></div>
      <div class="B-review">${s.status==='proposed'?reviewControls(cid).replace('<div class="">','<div style="display:grid;gap:6px;flex:1">'):reviewControls(cid)}</div>`;
  }
  const log = S.chat[p].slice(-8).map(x=> x.who==='user' ? `<div class="m user">${esc(x.text)}</div>` : x.kind==='opening' ? `<div class="m">${openingText()}</div>` : x.kind==='text' ? `<div class="m">${esc(x.text)}</div>` : x.kind==='reviewed' ? `<div class="m">Verdict on <b class="mono">${x.cid}</b> ${x.decision}.</div>` : `<div class="m">Assessment of <b class="mono">${x.cid}</b>: ${stOf(x.cid).status==='running'?'running…':'see the working paper.'}</div>`).join('');
  const rail = `<aside class="B-rail"><div><div class="lbl">Readiness</div><div style="margin-top:6px">${readinessBar()}</div></div>
    <div class="lbl">Ask Vouch</div><div class="log">${log}</div>
    ${s.trace && s.status!=='running' ? `<details><summary class="lbl" style="cursor:pointer">Steps for ${cid}</summary>${traceHtml(s.trace)}</details>`:''}
    <form data-act="send" style="display:flex;gap:6px"><input type="text" id="ask-b" placeholder="Ask about ${cid}…" autocomplete="off"><button class="btn btn-primary">Ask</button></form></aside>`;
  return `<div class="B"><nav class="B-index" aria-label="Controls">${idx}</nav><main class="B-paper wrap">${paper}</main>${rail}</div>`;
}

/* ---------- Variant C: Docket ---------- */
function VariantC(){
  const p = S.profile, cid = S.sel, s = stOf(cid), res = RES[p][cid], isa = ISA[cid];
  const strip = ORDER.map(id=>{const st=stOf(id), v=verdictOf(id); return `<button class="C-step ${st.status==='accepted'||st.status==='running'?'v-'+v:''} ${st.status}" data-act="sel" data-cid="${id}" aria-current="${id===cid}" title="${esc(ISA[id].q)}">${id}</button>`;}).join('');
  const areas = AREAS.map(a=>`<span>${a.name}</span>`).join('');
  let body;
  if (s.status==='none') body = `<div class="C-narr"><p>${p==='aw'?'Diese Frage ist noch nicht bewertet.':'This question has not been assessed yet.'} ${reqList(cid).length} requirements apply${OVERLAY[p]?.[cid]?', one of them added by the country overlay':''}.</p></div><div><button class="btn btn-primary" data-act="run" data-cid="${cid}">Assess ${cid}</button></div>`;
  else if (s.status==='running') body = `<div class="C-narr">${s.trace.map(t=>`<p><span class="mono muted" style="font-size:12px">${esc(t.b)}</span> ${esc(t.txt)}</p>`).join('')}</div>`;
  else {
    const rs = reqList(cid).map(r=>({...r, rr:res.reqs[r.id]||{v:'gap'}}));
    const item = r => `<div class="C-item"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><span class="mono muted">${r.id}</span><span class="lbl">${COLNAME[r.col]}</span>${chip(r.na?'na':r.rr.v)}</div><div>${esc(r.text.split('\n')[0])}</div>${r.na?`<div class="muted" style="font-size:12px">${esc(r.na)}</div>`:''}${r.rr.why?`<div class="muted" style="font-size:12px">${esc(r.rr.why)}</div>`:''}${(r.rr.cites||[]).map(citeHtml).join('')}${r.rr.v==='gap'&&!r.na?`<div>${remButton(cid,r.id)}</div>`:''}</div>`;
    const have = rs.filter(r=>!r.na && r.rr.v==='found'), part = rs.filter(r=>!r.na && r.rr.v==='partial'), miss = rs.filter(r=>!r.na && r.rr.v==='gap'), na = rs.filter(r=>r.na);
    body = `<div class="C-narr"><p>${esc(res.answer)}</p></div>
      <div class="C-cols"><div class="C-col"><h3>${vl('found')} (${have.length})</h3>${have.map(item).join('')||'<p class="muted">None.</p>'}</div>
      <div class="C-col"><h3>${vl('partial')} or ${vl('gap').toLowerCase()} (${part.length+miss.length})</h3>${[...miss,...part].map(item).join('')||'<p class="muted">None.</p>'}${na.map(item).join('')}</div></div>
      <details><summary class="lbl" style="cursor:pointer">How Vouch reached this</summary>${traceHtml(s.trace)}</details>`;
  }
  const i = ORDER.indexOf(cid), next = ORDER[(i+1)%12], prev = ORDER[(i+11)%12];
  const drafts = S.rem.filter(r=>r.p===p && r.status==='draft');
  const decide = `<div class="C-decide"><button class="btn" data-act="sel" data-cid="${prev}">← ${prev}</button>
    <div style="flex:1;min-width:200px">${s.status==='proposed'?`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center"><input type="text" id="note-${cid}" placeholder="Optional note for the audit trail" style="flex:1;min-width:160px"><button class="btn btn-sign" data-act="accept" data-cid="${cid}">Accept</button><button class="btn" data-act="reject" data-cid="${cid}">Reject</button></div>`:reviewControls(cid)||`<span class="muted">${s.status==='none'?vl('none'):''}</span>`}</div>
    <button class="btn btn-primary" data-act="sel" data-cid="${next}">${next} →</button>
    ${drafts.length?`<div class="C-tray" style="flex-basis:100%"><div class="lbl">Remediation drafts (${drafts.length})</div>${drafts.map(r=>`<div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;padding-top:4px"><span class="mono">${r.cid} ${r.req}</span><span style="flex:1;min-width:180px">${esc(r.text)} · ${esc(r.owner)} · due ${r.due}</span><button class="btn btn-ghost" data-act="remok" data-id="${r.id}">Approve</button><button class="btn btn-ghost" data-act="remno" data-id="${r.id}">Discard</button></div>`).join('')}</div>`:''}</div>`;
  return `<div class="C wrap"><div><div class="C-strip">${strip}</div><div class="C-areas" style="margin-top:4px">${areas}</div></div>
    <div class="sheet" style="padding:12px 16px;font-size:13px">${openingText()}</div>
    <article class="sheet C-card"><div class="lbl">Question ${i+1} of 12 · ${AREAS.find(a=>a.ids.includes(cid)).name} · ISO 27001 ${esc(isa.iso)}</div>
    <div class="C-q"><span class="mono" style="font-size:18px">${cid}</span> ${esc(isa.q)} ${s.status!=='none'&&s.status!=='running'?chip(s.verdict):''}</div>${body}</article>${decide}</div>`;
}

/* ---------- Variant D: Dossier ---------- */
function VariantD(){
  const p = S.profile, prof = PROFILES[p], c = counts(p), n = nextSuggestion(p), cid = S.sel, s = stOf(cid), res = RES[p][cid], isa = ISA[cid];
  const de = prof.lang==='de';
  const head = de ? `${c.accepted+c.rejected} von 12 geprüft.` : `${c.accepted} of 12 controls accepted.`;
  const sub = de ? 'Das österreichische NIS2-Overlay ergänzt bei 1.6.2 eine Anforderung. Beginnen Sie dort.' : `${c.proposed} verdict${c.proposed===1?'':'s'} waiting for your review, ${c.rejected} rejected. ${n.none?`Next suggested: ${n.none}.`:''}`;
  const actions = [n.prop&&['focus',n.prop,`Review ${n.prop}`,'btn-primary'], n.rej&&['run',n.rej,`Assess ${n.rej} again`,''], n.none&&['run',n.none,`Assess ${n.none}`, n.prop?'':'btn-primary'], ['view-report','','Readiness report','']].filter(Boolean);
  const log = S.chat[p].slice(-5).map(x=> x.who==='user' ? `<div class="m user">${esc(x.text)}</div>` : x.kind==='opening' ? `<div class="m">${openingText()}</div>` : x.kind==='text' ? `<div class="m">${esc(x.text)}</div>` : x.kind==='reviewed' ? `<div class="m">Verdict on <b class="mono">${x.cid}</b> ${x.decision}.</div>` : `<div class="m">Assessment of <b class="mono">${x.cid}</b>: ${stOf(x.cid).status==='running'?'running…':'see below.'}</div>`).join('');
  const hero = `<section class="D-hero"><div><span class="D-pill">${esc(prof.company)} · ${esc(prof.country)}</span>
      <h1>${de?'Audit vorbereitet. Beleg für Beleg.':'Prepared for audit. One piece of evidence at a time.'}</h1>
      <p><b style="color:var(--ink)">${esc(head)}</b> ${esc(sub)}</p>
      <div class="next">${actions.map(([a,id,label,cls])=> a==='view-report' ? `<button class="btn" data-act="view" data-view="report">${label}</button>` : `<button class="btn ${cls}" data-act="${a==='focus'?'sel':'run'}" data-cid="${id}" data-scroll="detail">${label}</button>`).join('')}</div></div>
    <div class="D-chat"><div class="lbl">Vouch</div><div class="log">${log}</div>
      <form data-act="send" style="display:flex;gap:6px"><input type="text" id="ask-d" placeholder="${de?'Frage an Vouch':'Ask Vouch, for example “Assess 5.2.5”'}" autocomplete="off"><button class="btn btn-primary">Send</button></form></div></section>`;
  const band = `<section class="D-band"><div><span class="D-pill">${de?'Stand':'Where you stand'}</span><h2>${de?'Bereitschaft':'Readiness'}</h2></div>
      <p>${esc(prof.overlay)}. VDA ISA subset of 12 questions at ${prof.protection} protection. Only verdicts you accepted count; the figures describe evidence coverage, not ISA maturity levels.</p>
      <div class="D-tiles"><div class="D-tile"><b>${c.accepted}</b><span>accepted of 12</span></div><div class="D-tile"><b>${c.found}</b><span>${vl('found').toLowerCase()}</span></div><div class="D-tile"><b>${c.partial}</b><span>${vl('partial').toLowerCase()}</span></div><div class="D-tile"><b>${c.gap}</b><span>${vl('gap').toLowerCase()}</span></div><div class="D-tile"><b>${c.proposed+c.rejected+c.none}</b><span>open</span></div><div class="D-tile"><b>${S.rem.filter(r=>r.p===p&&r.status!=='discarded').length}</b><span>remediation items</span></div></div></section>`;
  const cards = AREAS.map(a=>a.ids.map(id=>{const st=stOf(id), v=verdictOf(id); return `<button class="D-card" data-act="sel" data-cid="${id}" data-scroll="detail" aria-current="${id===cid}"><div class="face v-${v}"><b>${id}</b>${st.status==='none'?'':`<span class="st st-${st.status}">${st.status==='running'?'assessing':st.status}</span>`}</div><div class="q">${esc(ISA[id].q)}</div><div class="sub"><span>${a.name}</span>${st.status==='none'?`<span>${vl('none')}</span>`:chip(v)}</div></button>`;}).join('')).join('');
  let detail;
  if (s.status==='none') detail = `<p style="margin:0">${reqList(cid).length} requirements apply in this profile${OVERLAY[p]?.[cid]?', one added by the country overlay':''}.</p><div><button class="btn btn-primary" data-act="run" data-cid="${cid}">Assess ${cid}</button></div>`;
  else if (s.status==='running') detail = traceHtml(s.trace);
  else detail = `<p style="margin:0;max-width:75ch">${esc(res.answer)}</p><div class="D-reqs">${reqList(cid).map(r=>{const rr=res.reqs[r.id]||{v:'gap'}, v=r.na?'na':rr.v; return `<div class="D-req"><div style="display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap"><span><span class="mono">${r.id}</span> <span class="lbl">${COLNAME[r.col]}</span></span>${chip(v)}</div><div>${esc(r.text.split('\n')[0])}</div>${r.na?`<div class="muted" style="font-size:12px">${esc(r.na)}</div>`:''}${rr.why?`<div class="muted" style="font-size:12px">${esc(rr.why)}</div>`:''}${(rr.cites||[]).map(citeHtml).join('')}${v==='gap'&&!r.na?`<div>${remButton(cid,r.id)}</div>`:''}</div>`;}).join('')}</div>
      <details><summary class="lbl" style="cursor:pointer">How Vouch reached this</summary>${traceHtml(s.trace)}</details><div>${reviewControls(cid)}</div>`;
  const detailSec = `<section class="D-detail" id="detail"><div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap"><span class="D-pill">${cid} · ISO 27001 ${esc(isa.iso)}</span>${s.status!=='none'&&s.status!=='running'?chip(s.verdict):''}</div><h2 style="font-size:24px">${esc(isa.q)}</h2>${detail}</section>`;
  const seen = new Set(), quotes = [];
  ORDER.forEach(id=>{ const st=stOf(id); if (st.status==='none'||st.status==='running'||!RES[p][id]) return; Object.values(RES[p][id].reqs).forEach(r=>(r.cites||[]).forEach(x=>{ if(!x) return; const k=x.doc+x.q; if(!seen.has(k)){seen.add(k); quotes.push({...x, cid:id});} })); });
  const qsec = `<section style="display:grid;gap:16px"><div class="D-head"><span class="D-pill">${de?'Belege':'Evidence on file'}</span><h2>${de?'Was die Nachweise sagen':'What the evidence says'}</h2><p>Every quote below was found word for word in the cited document version.</p></div>
    <div class="D-quotes">${quotes.slice(0,8).map(x=>{const d=DOCS[x.doc]; return `<article class="D-quote"><div class="mark">“</div><p lang="${x.doc.startsWith('AW')?'de':'en'}">${esc(x.q)}</p><footer><span class="mono">${esc(x.doc)} v${esc(d.v)} · ${esc(x.sec)}</span><span><span class="kind kind-${d.k}">${d.k}</span> ${d.stale?'<span class="flag">stale</span>':''} · for ${x.cid}</span></footer></article>`;}).join('') || '<p class="muted">No assessed evidence yet.</p>'}</div></section>`;
  const ask = `<section class="D-ask"><div><h2>${de?'Fragen Sie Vouch':'Ask Vouch'}</h2><p>${de?'Zum Beispiel: Welche Controls haben nur dokumentierte Nachweise?':'For example: which controls have documented evidence only? Which remediation items are due this month?'}</p></div>
    <form data-act="send"><input type="text" id="ask-d2" placeholder="${de?'Ihre Frage':'Your question'}" autocomplete="off"><button class="btn btn-primary">Ask</button></form></section>`;
  const foot = `<footer class="D-foot"><div><b>Vouch</b>Drafted by an AI assistant, reviewed by ${esc(prof.lead)}; not an audit result.</div><div><b>Profile</b>${esc(prof.company)}<br>${prof.langLabel} · protection ${prof.protection}</div><div><b>Sources</b>VDA ISA 6, © ENX Association, CC BY-ND 4.0</div></footer>`;
  return `<div class="D wrap">${hero}${band}<section style="display:grid;gap:16px"><div class="D-head"><span class="D-pill">${de?'Controls':'The controls'}</span><h2>${de?'Zwölf Fragen, vier Bereiche':'Twelve questions, four areas'}</h2><p>Pick a control to see its requirements, the evidence behind each verdict, and your review.</p></div><div class="D-cards">${cards}</div></section>${detailSec}${qsec}${ask}${foot}</div>`;
}

/* ---------- Report (shared) ---------- */
function Report(){
  const p = S.profile, prof = PROFILES[p], c = counts(p);
  const rows = ORDER.map(cid=>{const s=stOf(cid); return `<tr><td class="mono">${cid}</td><td>${esc(ISA[cid].q)}</td><td>${s.status==='accepted'?chip(s.verdict):s.status==='none'?'<span class="muted">'+vl('none')+'</span>':`<span class="st st-${s.status}">${s.status==='running'?'assessing':s.status}</span>`}</td><td>${s.review?esc(s.review.by)+', '+s.review.at:''}</td></tr>`;}).join('');
  const rems = S.rem.filter(r=>r.p===p && r.status==='approved');
  const na = Object.entries(prof.na);
  const trail = S.trail.filter(t=>t.p===p).slice().reverse();
  return `<article class="sheet doc wrap"><div><div class="lbl">Readiness report · ${today}</div><h1 style="font-size:28px;margin-top:4px">${esc(prof.company)}</h1>
    <p class="muted" style="margin:4px 0 0">VDA ISA subset (12 questions) · protection ${prof.protection} · ${esc(prof.overlay)} · answers in ${prof.langLabel}</p></div>
    <div class="kpis"><div><b>${c.accepted}</b><span class="muted">accepted of 12</span></div><div><b>${c.found}</b><span class="muted">${vl('found').toLowerCase()}</span></div><div><b>${c.partial}</b><span class="muted">${vl('partial').toLowerCase()}</span></div><div><b>${c.gap}</b><span class="muted">${vl('gap').toLowerCase()}</span></div><div><b>${c.proposed+c.rejected+c.none}</b><span class="muted">open</span></div></div>
    <div>${readinessBar(p)}</div>
    <section><h2 style="font-size:18px;margin-bottom:6px">Controls</h2><div class="tw"><table><thead><tr><th>ISA</th><th>Question</th><th>Reviewed verdict</th><th>Reviewed by</th></tr></thead><tbody>${rows}</tbody></table></div><p class="muted" style="font-size:12px">Only accepted verdicts count towards readiness. Verdicts describe evidence coverage, not ISA maturity levels.</p></section>
    <section><h2 style="font-size:18px;margin-bottom:6px">Remediation items</h2>${rems.length?`<div class="tw"><table><thead><tr><th>#</th><th>ISA</th><th>Item</th><th>Owner</th><th>Due</th></tr></thead><tbody>${rems.map(r=>`<tr><td>${r.id}</td><td class="mono">${r.cid} ${r.req}</td><td>${esc(r.text)}</td><td>${esc(r.owner)}</td><td>${r.due}</td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">None approved yet.</p>'}</section>
    <section><h2 style="font-size:18px;margin-bottom:6px">Not applicable</h2>${na.length?na.map(([k,v])=>`<p style="margin:0"><span class="mono">${k.replace(':',' ')}</span>: ${esc(v)}</p>`).join(''):'<p class="muted">Nothing excluded.</p>'}</section>
    <section><h2 style="font-size:18px;margin-bottom:6px">Audit trail</h2><div class="tw"><table><thead><tr><th>Date</th><th>Who</th><th>ISA</th><th>Action</th><th>Evidence versions</th><th>Drafted by</th></tr></thead><tbody>${trail.map(t=>`<tr><td>${t.at}</td><td>${esc(t.who)}</td><td class="mono">${t.cid}</td><td>${esc(t.what)}${t.note?`<div class="muted">“${esc(t.note)}”</div>`:''}</td><td class="mono" style="font-size:12px">${esc(t.docs)}</td><td class="mono" style="font-size:12px">${t.model}<br>${t.prompt}</td></tr>`).join('')}</tbody></table></div></section>
    <p class="disclaimer">Drafted by an AI assistant, reviewed by ${esc(prof.lead)}; not an audit result. Questions from VDA ISA 6, © ENX Association, CC BY-ND 4.0. ISO 27001 is referenced by control number only.</p></article>`;
}

/* ---------- Developer (shared) ---------- */
function Dev(){
  const runs = S.runs.filter(r=>r.p===S.profile), tin = runs.reduce((a,r)=>a+r.tok[0],0), tout = runs.reduce((a,r)=>a+r.tok[1],0);
  return `<article class="sheet doc wrap"><div class="devbanner">Developer page: visible to developers only, never to the compliance lead.</div>
    <h1 style="font-size:24px">Model and usage</h1>
    <div class="tw"><table><tbody>
      <tr><th>Model</th><td><select id="dev-model"><option>anthropic/claude-haiku-5.5</option><option>anthropic/claude-sonnet-5.5</option></select></td></tr>
      <tr><th>Prompt version</th><td class="mono">assess-v0.3 · chat-v0.2</td></tr>
      <tr><th>Rate limit</th><td>${runs.length} of 30 assessments today, per user</td></tr>
      <tr><th>Spending cap</th><td>Set on the OpenRouter key</td></tr>
    </tbody></table></div>
    <h2 style="font-size:18px">Assessments in this profile</h2>
    <div class="tw"><table><thead><tr><th>ISA</th><th>Date</th><th class="num">Tokens in</th><th class="num">Tokens out</th><th class="num">Cost (USD)</th></tr></thead><tbody>
    ${runs.map(r=>`<tr><td class="mono">${r.cid}</td><td>${r.at}</td><td class="num">${r.tok[0].toLocaleString('en')}</td><td class="num">${r.tok[1].toLocaleString('en')}</td><td class="num">${cost(r.tok).toFixed(4)}</td></tr>`).join('')}
    <tr><th>Total</th><td></td><td class="num">${tin.toLocaleString('en')}</td><td class="num">${tout.toLocaleString('en')}</td><td class="num">${cost([tin,tout]).toFixed(4)}</td></tr></tbody></table></div>
    <p class="muted" style="font-size:12px">Token counts and prices are invented for the prototype.</p></article>`;
}

/* ---------- prototype switcher and notes ---------- */
const VARIANTS = [['A','Counsel: chat-first'],['B','Working paper'],['C','Docket: one control at a time'],['D','Dossier: overview page']];
const QUESTIONS = [
  'Which variant (or which parts of each) fits a compliance lead preparing for weeks: chat-first, the working paper, or one question at a time?',
  'Should-requirements are shown but don\'t change the verdict here. Should they count, and how?',
  'Review granularity: accept the whole control (as here), or accept or reject each requirement?',
  'A rejected verdict: assess again automatically once evidence changes, or does the lead set the verdict by hand?',
  'How much of the agent\'s steps does a compliance lead want by default: hidden (A), a side panel (B), or narrated (C)?',
  'Remediation: one item per missing requirement (as here), or one per control?',
  'Wording: the glossary says found / partial / gap, the screen says Evidenced / Partly / Not evidenced. One vocabulary on screen?',
  'Austrian profile: the interface stays English and only the answers are German. Should the interface follow the profile\'s language too?',
  'ISA ships a German edition. Should a German-language profile cite the German ISA text?',
  'Is the readiness report a page you would hand to an auditor, or only to your own management?'
];
function Switcher(){
  const i = VARIANTS.findIndex(v=>v[0]===S.variant);
  return `<div class="proto" role="toolbar" aria-label="Prototype switcher"><button data-act="vprev" aria-label="Previous variant">←</button><span class="cur">${VARIANTS[i][0]} · ${VARIANTS[i][1]}</span><button data-act="vnext" aria-label="Next variant">→</button><button data-act="pane" data-pane="q">Questions</button><button data-act="pane" data-pane="state">State</button><button data-act="style">Style: ${S.style==='tailored'?'Tailored':'Plain'}</button><button data-act="theme">Theme: ${({light:'Light',dark:'Dark',system:'System'})[S.theme]}</button></div>
  ${S.pane==='q'?`<div class="pane"><h4>Questions this prototype should answer</h4><ol>${QUESTIONS.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></div>`:''}
  ${S.pane==='state'?`<div class="pane"><h4>State (${S.profile})</h4><pre>${esc(JSON.stringify({variant:S.variant, view:S.view, profile:S.profile, selected:S.sel, running:S.running, controls:Object.fromEntries(ORDER.map(cid=>[cid, (({status,verdict,review})=>({status,verdict,review}))(stOf(cid))])), remediation:S.rem.filter(r=>r.p===S.profile), auditTrailEntries:S.trail.filter(t=>t.p===S.profile).length}, null, 1))}</pre></div>`:''}`;
}

/* ---------- render ---------- */
function Top(){
  const prof = PROFILES[S.profile];
  return `<header class="top"><div class="top-in wrap"><div class="brand"><b>Vouch</b><span>Audit preparation</span></div>
    <nav class="nav">${[['prep','Prep'],['report','Readiness report'],['dev','Developer']].map(([k,n])=>`<button data-act="view" data-view="${k}" aria-current="${S.view===k?'page':'false'}">${n}</button>`).join('')}</nav>
    <div class="prof"><label class="lbl" for="prof">Profile</label><select id="prof" data-act="profile">${Object.values(PROFILES).map(x=>`<option value="${x.id}" ${x.id===S.profile?'selected':''}>${esc(x.company)} · ${x.country} · ${x.langLabel}</option>`).join('')}</select></div>
  </div><div class="wrap ctx" style="padding-block:0 6px">VDA ISA subset · protection ${prof.protection} · ${esc(prof.overlay)}</div></header>`;
}
function render(){
  const focus = document.activeElement?.id, val = focus ? document.getElementById(focus)?.value : null;
  const notes = {}; document.querySelectorAll('textarea[id^=note-],input[id^=note-]').forEach(t=>notes[t.id]=t.value);
  if (document.documentElement) { document.documentElement.dataset.style = S.style; if (S.theme==='system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = S.theme; }
  const view = S.view==='report' ? Report() : S.view==='dev' ? Dev() : ({A:VariantA, B:VariantB, C:VariantC, D:VariantD})[S.variant]();
  document.getElementById('app').innerHTML = Top() + view + Switcher();
  Object.entries(notes).forEach(([id,v])=>{const el=document.getElementById(id); if(el) el.value=v;});
  if (focus && document.getElementById(focus)) { const el = document.getElementById(focus); el.focus(); if (val!=null && 'value' in el) el.value = val; }
}
function setVariant(v){ S.variant = v; try{ history.replaceState(null,'','#variant-'+v.toLowerCase()); }catch(e){} render(); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.tagName==='FORM' || b.tagName==='SELECT') return;
  const a = b.dataset.act, cid = b.dataset.cid;
  if (a==='run') run(cid);
  else if (a==='sel') { S.sel = cid; render(); if (b.dataset.scroll) document.getElementById(b.dataset.scroll)?.scrollIntoView({behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block:'start'}); }
  else if (a==='focus') { S.sel = cid; if (S.variant==='A') { const s=stOf(cid); if (s.status==='proposed' && !S.chat[S.profile].some(x=>x.kind==='assessment'&&x.cid===cid)) S.chat[S.profile].push({who:'vouch', kind:'assessment', cid}); else if (s.status==='accepted' && !S.chat[S.profile].some(x=>x.kind==='assessment'&&x.cid===cid)) S.chat[S.profile].push({who:'vouch', kind:'assessment', cid}); } render(); }
  else if (a==='accept') review(cid,'accepted');
  else if (a==='reject') review(cid,'rejected');
  else if (a==='rem') draftRem(cid, b.dataset.req);
  else if (a==='remok') decideRem(+b.dataset.id, true);
  else if (a==='remno') decideRem(+b.dataset.id, false);
  else if (a==='ask') { const t = b.dataset.text; const m = t.match(/\d\.\d\.\d/); if (t.startsWith('Review') && m) { S.sel=m[0]; if (!S.chat[S.profile].some(x=>x.kind==='assessment'&&x.cid===m[0])) S.chat[S.profile].push({who:'vouch',kind:'assessment',cid:m[0]}); render(); } else ask(t); }
  else if (a==='view') { S.view = b.dataset.view; render(); }
  else if (a==='vprev'||a==='vnext') { const i = VARIANTS.findIndex(v=>v[0]===S.variant); setVariant(VARIANTS[(i + (a==='vnext'?1:VARIANTS.length-1)) % VARIANTS.length][0]); }
  else if (a==='theme') { S.theme = ({light:'dark', dark:'system', system:'light'})[S.theme]; render(); }
  else if (a==='style') { S.style = S.style==='tailored' ? 'plain' : 'tailored'; render(); }
  else if (a==='pane') { S.pane = S.pane===b.dataset.pane ? null : b.dataset.pane; render(); }
});
document.addEventListener('change', e => { if (e.target.id==='prof') { S.profile = e.target.value; S.sel = S.profile==='aw' ? '1.6.2' : '5.1.1'; render(); } });
document.addEventListener('submit', e => { e.preventDefault(); const inp = e.target.querySelector('input'); const t = inp.value.trim(); if (t) { inp.value=''; ask(t); } });
document.addEventListener('keydown', e => {
  if (e.target.closest('input,textarea,select,[contenteditable]')) return;
  if (e.key==='ArrowRight'||e.key==='ArrowLeft') { const i = VARIANTS.findIndex(v=>v[0]===S.variant); setVariant(VARIANTS[(i + (e.key==='ArrowRight'?1:VARIANTS.length-1)) % VARIANTS.length][0]); }
});
window.addEventListener('hashchange', () => { const m = location.hash.match(/variant-([abcd])/i); if (m) { S.variant = m[1].toUpperCase(); render(); } });

(function start(){
  let v = null;
  try { v = new URLSearchParams(location.search).get('variant'); } catch(e) {}
  const m = location.hash.match(/variant-([abcd])/i); if (m) v = m[1];
  if (v && /^[abcd]$/i.test(v)) S.variant = v.toUpperCase();
  seed(); render();
})();
</script>
