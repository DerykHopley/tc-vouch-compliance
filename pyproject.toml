[project]
name = "vouch"
version = "0.1.0"
description = "Assess compliance controls against company policies with a LangGraph agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain-core",
    "pyyaml",
    "langchain-openai>=1.7.3",
]

[project.scripts]
assess = "vouch.cli:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-socket>=0.8.1",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff]
line-length = 100
target-version = "py312"
# trial/ is frozen evidence from the process trial; scripts/design-lint.py is the rig's copy.
extend-exclude = ["trial", "scripts/design-lint.py"]
