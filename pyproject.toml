[project]
name = "vouch"
version = "0.1.0"
description = "Assess compliance controls against company policies with a LangGraph agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "langgraph",
    "langchain-core",
    "pyyaml",
    "langchain-openai>=1.7.3",
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "clerk-backend-api>=7.0.0,<7.1",
    "httpx>=0.28.1",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.8",
]

[project.scripts]
assess = "vouch.cli:main"
vouch-db-setup = "vouch.database:main"

[dependency-groups]
dev = [
    "pyjwt[crypto]>=2.9",
    "pytest",
    "pytest-socket>=0.8.1",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vouch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket --allow-unix-socket"  # unix: the event loop's self-pipe (TestClient)

[tool.ruff]
line-length = 100
target-version = "py312"
# trial/ is frozen evidence from the process trial; scripts/design-lint.py is the rig's copy.
extend-exclude = ["trial", "scripts/design-lint.py"]
