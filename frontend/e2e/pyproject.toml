[project]
name = "vouch-browser-check"
version = "0.1.0"
description = "The browser check (Playwright). Run it with frontend/e2e/run.sh."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pytest>=8",
    "pytest-playwright>=0.7",
    "playwright==1.64.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
