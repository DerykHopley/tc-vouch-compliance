source: VDA ISA 2027.1
excel: isa2027.1-en.xlsx
controls:
- id: 1.1.1
  question: To what extent are information security policies available?
  iso_27001: 'ISO 27001:2022: A.5.1'
  requirements:
  - id: M1
    column: must
    text: The requirements for information security have been determined, documented and adapted to the organization’s goals.
  - id: M2
    column: must
    text: A policy exists, and is approved by the organization’s management.
  - id: M3
    column: must
    text: The policy includes objectives and the significance of information security within the organization.
  - id: M4
    column: must
    text: The policies are made available to employees in a suitable form (e.g., intranet).
  - id: M5
    column: must
    text: Employees and external business partners are informed of any changes relevant to them.
  - id: S1
    column: should
    text: The information security requirements are based on the strategy of the organization. Legislation and contracts are considered in the policy.
  - id: S2
    column: should
    text: The policy indicates consequences in case of non-conformance.
  - id: S3
    column: should
    text: Other relevant security policies are established.
  - id: S4
    column: should
    text: Periodic review and, if required, revision of the policies are established.
- id: 1.6.1
  question: To what extent are information security relevant events or observations reported?
  iso_27001: 'ISO 27001:2022: A.5.24, A.6.8'
  requirements:
  - id: M1
    column: must
    text: "A definition for a reportable security event or observation exists and is known by employees and relevant stakeholders. The following aspects are considered:\n  - Events and observations related to personnel\n  - Events and observations related to physical security (e.g., intrusion, theft, unauthorized access to security zones, vulnerabilities in the security zones)\n  - Events and observations related to IT and cyber security (e.g., vulnerable IT-systems, detected successful or unsuccessful attacks)\n  - Events and observations related to suppliers and other business partners (e.g., any incidents that can have negative effect on the security of own organization)"
  - id: M2
    column: must
    text: Adequate mechanisms based on perceived risks to report security events are defined, implemented, and known to all relevant potential reporters
  - id: M3
    column: must
    text: Adequate channels for communication with event reporters exist.
  - id: S1
    column: should
    text: A common point of contact for event reporting exists.
  - id: S2
    column: should
    text: Different reporting channels according to perceived severity (i.e., real time communication for significant events / emergencies in addition to asynchronous mechanisms such as tickets or email). are available
  - id: S3
    column: should
    text: Employees are obligated and trained to report relevant events.
  - id: S4
    column: should
    text: "Security event reports can also be submitted by external parties. The following aspects are considered:\n  - Availability and communication of a security event report channel for external parties,\n  -  Timely processing of security event reports from external parties."
  - id: S5
    column: should
    text: Mechanism to, and information how to, report incidents is accessible by all relevant reporters.
  - id: S6
    column: should
    text: A feedback procedure to reporters is established.
  - id: V1
    column: very high
    text: Tests and exercises of event and observation reporting are conducted regularly. (C, I, A)
- id: 1.6.2
  question: To what extent are reported security events managed?
  iso_27001: 'ISO 27001:2022: A.5.24-27'
  requirements:
  - id: M1
    column: must
    text: Reported events are processed without undue delay.
  - id: M2
    column: must
    text: An adequate reaction to reported security events is ensured.
  - id: M3
    column: must
    text: Lessons learned are incorporated into continuous improvement.
  - id: S1
    column: should
    text: During processing, reported events are categorized (e.g. by responsibility into personnel, physical and cyber), qualified (e.g., not security relevant, observation, suggested security improvement, security vulnerability, security incident) and prioritized (e.g., low, moderate, severe, critical).
  - id: S2
    column: should
    text: "Responsibilities for handling of events based on their category are defined and assigned. The following aspects are considered:\n  - Coordination of incidents and vulnerabilities across multiple categories,\n  - Qualification and resources,\n  - Communication methods based on type and priority (e.g., non-time-critical communication, time-critical communication, emergency communication),\n  - Absence-management."
  - id: S3
    column: should
    text: A strategy for reporting potentially criminal aspects of security incidents to relevant authorities when necessary or appropriate. (C, I, A).
  - id: H1
    column: high
    text: Maximum response times based on class, category and severity are defined. (C, I, A)
  - id: H2
    column: high
    text: "Events not processed appropriately according to their priority are escalated. The following aspects are considered: (C, I, A)\n  - Conditions and thresholds (e.g., maximum reaction time before escalation),\n  - Mechanisms, processes, and contacts for escalation,\n  - Escalation paths up to the organization’s top management."
  - id: H3
    column: high
    text: Lawful, regulatory, and contractual reporting obligations, and respective contact information are known. (C, I, A)
  - id: H4
    column: high
    text: "A communication strategy for security related events exists. The following aspects are considered: (C, I, A)\n  - To whom to communicate (e.g., shareholders, affected business partners and customers, other shareholders, general public),\n  - When to communicate,\n  - Responsibilities for communication,\n  - Authorization and approval of communication,\n  - Legal and regulatory restrictions of communication,\n  - What to communicate (e.g., prepared templates and building blocks for specific scenarios),\n  - How to communicate (e.g., communication channels)."
  - id: H5
    column: high
    text: "Procedures for response to supplier security incidents are established. The following aspects are considered: (C, I, A)\n  - Analysis of the impact on the own organization and invocation of appropriate internal mechanisms.\n  - The need for reporting according to own reporting procedures"
  - id: V1
    column: very high
    text: "Handling of events in different categories and priorities is regularly tested. The following aspects are considered: (A)\n  - Exercise or simulation of rarely occurring categories and priorities,\n  - Exercise or simulation include escalation mechanisms."
- id: 2.1.3
  question: To what extent is staff made aware of and trained with respect to the risks arising from the handling of information?
  iso_27001: 'ISO 27001:2022: 7.2, 7.3, A.6.3'
  requirements:
  - id: M1
    column: must
    text: Employees are trained and made aware.
  - id: S1
    column: should
    text: "A concept for awareness and training of employees is prepared. The following aspects are considered:\n  - Information security policy,\n  - Reporting of information security events,\n  - Reaction to occurrence of malware,\n  - Policies regarding user accounts and login information (e.g., password policy),\n  - Compliance issues of information security,\n  - Requirements and procedures regarding the use of non-disclosure agreements when sharing information requiring protection,\n  - Use of external IT services."
  - id: S2
    column: should
    text: Target groups for training and awareness measures (i.e., people working in specific risk environments such as managers including organizational leaders, administrators, employees having access to customer networks, personnel in areas of manufacturing) are identified and considered in a training concept.
  - id: S3
    column: should
    text: The concept has been approved by the responsible management.
  - id: S4
    column: should
    text: Training and awareness measures are carried out both at regular intervals and in response to events.
  - id: S5
    column: should
    text: Participation in training and awareness measures is documented.
  - id: S6
    column: should
    text: Contact persons for information security are known to employees.
- id: 4.1.2
  question: To what extent is the user access to IT services and IT systems secured?
  iso_27001: 'ISO 27001:2022: A.5.15, A.8.5'
  requirements:
  - id: M1
    column: must
    text: The procedures for user authentication are selected based on a risk assessment. Possible attack scenarios are considered (e.g., direct accessibility via the internet).
  - id: M2
    column: must
    text: Authentication procedures are consistent with recognized security best practices.
  - id: S1
    column: should
    text: The user authentication procedures are defined and implemented based on the business-related and security-relevant requirements.
  - id: S2
    column: should
    text: Users are authenticated at least by means of strong passwords according to proven and widely accepted practices.
  - id: S3
    column: should
    text: Superior procedures are used for the authentication of privileged user accounts (e.g., privileged access management, two-factor authentication).
  - id: H1
    column: high
    text: Depending on the risk assessment, authentication procedure and access control have been enhanced by supplementary measures (e.g., continuous access monitoring with respect to irregularities or use of strong authentication, automatic logout, disabling in case of inactivity, or brute force prevention). (C, I, A)
  - id: V1
    column: very high
    text: Before gaining access to data of very high protection needs, users are authenticated by means of strong authentication (e.g., two-factor authentication) (C, I)
- id: 4.1.3
  question: To what extent are user accounts and login information securely managed and applied?
  iso_27001: 'ISO 27001:2022: A.5.16, A.5.17, A.5.18, A.8.9'
  requirements:
  - id: M1
    column: must
    text: The creating, changing, and deleting of user accounts is conducted.
  - id: M2
    column: must
    text: Unique and personalized user accounts are used.
  - id: M3
    column: must
    text: The use of “shared accounts” is regulated (e.g., restricted to cases where traceability of actions is dispensable).
  - id: M4
    column: must
    text: User accounts are disabled immediately after the user has resigned from or left the organization (e.g., upon termination of the employment contract).
  - id: M5
    column: must
    text: User accounts are regularly reviewed.
  - id: M6
    column: must
    text: The login information is provided to the user in a secure manner.
  - id: M7
    column: must
    text: "A policy for the handling of login information is defined and implemented. The following aspects are considered:\n  - No disclosure of login information, not even to persons of authority, within the limits of applicable law,\n  - No writing down or unencrypted storing of login information,\n  - Immediate changing of login information whenever potential compromising is suspected,\n  - No use of identical login information for business and non-business purposes,\n  - Changing of temporary or initial login information following the 1st login,    \n  - Requirements for the quality of authentication information (e.g., length of password, types of characters to be used)."
  - id: S1
    column: should
    text: A basic user account with minimum access rights and functionalities is existent and used.
  - id: S2
    column: should
    text: Default accounts and passwords pre-configured by manufacturers are disabled (e.g., by blocking or changing of password).
  - id: S3
    column: should
    text: User accounts are created or authorized by the responsible body.
  - id: S4
    column: should
    text: Creating user accounts is subject to an approval process (four-eyes principle).
  - id: S5
    column: should
    text: User accounts of service providers are disabled upon completion of their task.
  - id: S6
    column: should
    text: Deadlines for disabling and deleting user accounts are defined.
  - id: S7
    column: should
    text: The use of default passwords is technically prevented.
  - id: S8
    column: should
    text: Where strong authentication is applied, the use of the medium (e.g., ownership factor) is secure.
  - id: S9
    column: should
    text: User accounts are reviewed at regular intervals. This also includes user accounts in customers' IT systems.
  - id: S10
    column: should
    text: Interactive login for service accounts (technical accounts) is technically prevented.
- id: 4.2.1
  question: To what extent are access rights assigned and managed?
  iso_27001: ISO 27001:2022 A.5.18
  requirements:
  - id: M1
    column: must
    text: 'The requirements for the management of access rights (authorization) are determined and fulfilled. The following aspects are considered:

        - Procedure for application, verification, and approval,

        - Applying the minimum (“need-to-know”/"least privilege") principle,

        - Access rights are revoked when no longer needed.'
  - id: M2
    column: must
    text: The access rights granted for normal and privileged user accounts and technical accounts are reviewed at regular intervals also within IT systems of customers.
  - id: S1
    column: should
    text: Strategies for authorizing access to information are prepared.
  - id: S2
    column: should
    text: Authorization roles are used.
  - id: S3
    column: should
    text: Rights are allocated on a need-to-use basis and according to the role and/or area of responsibility.
  - id: S4
    column: should
    text: Normal user accounts are not granted privileged access rights.
  - id: S5
    column: should
    text: The user’s access rights are updated after the user’s responsibilities have changed (e.g., to another field of responsibility).
  - id: H1
    column: high
    text: The access rights are approved by the responsible internal Information Officer. (C, I, A)
  - id: V1
    column: very high
    text: Information is stored in encrypted form at content level (e.g., file level) to prevent unauthorized persons from gaining access and information (privileged users). Where encryption is not feasible, information shall be protected by similarly effective measures. (C)
  - id: V2
    column: very high
    text: Existing access rights are regularly reviewed at shorter intervals (e.g., quarterly). (C)
- id: 5.1.1
  question: To what extent is the use of cryptographic procedures managed?
  iso_27001: 'ISO 27001:2022: A.8.24'
  requirements:
  - id: M1
    column: must
    text: All cryptographic procedures used (e.g., encryption, signature, and hash algorithms, protocols) provide the security required by the respective application field according to the recognized industry standard to the extent legally feasible.
  - id: S1
    column: should
    text: "A concept for the application of cryptography is defined and implemented. The following aspects are considered:\n  - Cryptographic  methods,\n  - Key strengths,\n  - Procedures for the complete lifecycle of cryptographic keys, including generation, storage, archiving, retrieval, distribution, deactivation, renewal, and deletion."
  - id: H1
    column: high
    text: Key sovereignty requirements (particularly in case of external processing) are determined and fulfilled. (C, I)
- id: 5.1.2
  question: To what extent is information protected during transfer?
  iso_27001: 'ISO 27001:2022: A.5.14'
  requirements:
  - id: M1
    column: must
    text: The network services used to transfer information are identified and documented.
  - id: M2
    column: must
    text: Policies and procedures in accordance with the classification requirements for the use of network services are defined and implemented.
  - id: M3
    column: must
    text: Measures for the protection of transferred contents against unauthorized access are implemented.
  - id: S1
    column: should
    text: Measures for ensuring correct addressing and correct transfer of information are implemented.
  - id: S2
    column: should
    text: Electronic data exchange is conducted using content or transport encryption according to the respective classification.
  - id: S3
    column: should
    text: "Remote access connections to the organization’s network possess adequate security features. The following aspects are considered:   \n  - Encryption,\n  - Authentication strength,\n  - Granting and termination of access and capabilities,\n  - Using a secured connection (e.g. VPN)."
  - id: H1
    column: high
    text: Information is transported or transferred in encrypted form (at least transport-encryption) or protected by similarly effective measures. (C)
  - id: V1
    column: very high
    text: Information is transported or transferred in content-encrypted form. (C)
- id: 5.2.4
  question: To what extent are event logs recorded and analysed?
  iso_27001: 'ISO 27001:2022: A.5.17, A.8.15'
  requirements:
  - id: M1
    column: must
    text: Information security requirements regarding the handling of event logs are determined and fulfilled.
  - id: M2
    column: must
    text: Security-relevant requirements regarding the logging of activities of system administrators and users are determined and fulfilled.
  - id: M3
    column: must
    text: The IT systems used are assessed regarding the necessity of logging.
  - id: M4
    column: must
    text: When using external IT services, information on the monitoring options is obtained and considered in the assessment.
  - id: M5
    column: must
    text: Event logs are checked regularly for policy violations and noticeable problems in compliance with the permissible legal and organizational provisions.
  - id: S1
    column: should
    text: A procedure for the escalation of relevant events to the responsible body (e.g., security incident report, data protection, corporate security, IT security) is defined and established.
  - id: S2
    column: should
    text: Event logs (contents and meta data) are protected against alteration (e.g., by a dedicated environment).
  - id: S3
    column: should
    text: Adequate monitoring and recording of any actions on the network that are relevant to information security are established.
  - id: H1
    column: high
    text: Information security requirements relevant to the security during the handling of event logs, e.g., contractual requirements, are determined and implemented. (C, I, A)
  - id: H2
    column: high
    text: Events related to establishing and terminating remote access sessions (e.g., for remote maintenance) are logged. (C, I, A)
  - id: V1
    column: very high
    text: Logging of any access to data of very high protection needs is performed as far as technically feasible and as permissible according to legal and organizational provisions. (C, I)
- id: 5.2.5
  question: To what extent are vulnerabilities identified and addressed?
  iso_27001: 'ISO 27001:2022: A.8.8, A.8.19'
  requirements:
  - id: M1
    column: must
    text: "Information on technical vulnerabilities for the IT systems in use is gathered (e.g., information from the manufacturer, system audits, CVE database) \nand evaluated (e.g., Common Vulnerability Scoring System CVSS)."
  - id: M2
    column: must
    text: Potentially affected IT systems and software are identified and the risk caused by the vulnerability is assessed.
  - id: M3
    column: must
    text: Risks arising from vulnerabilities are treated.
  - id: S1
    column: should
    text: An adequate patch management is defined and implemented (e.g., patch testing and installation).
  - id: S2
    column: should
    text: Risk minimizing measures are implemented, as necessary.
  - id: S3
    column: should
    text: Successful installation of patches is verified in an appropriate manner.
- id: 5.2.9
  question: To what extent is the backup and recovery of data and IT services ensured?
  iso_27001: 'ISO 27001:2022: A.8.13'
  requirements:
  - id: M1
    column: must
    text: Backup concepts exist for relevant IT systems. Appropriate protective measures to ensure confidentiality, integrity, and availability for data backups are considered.
  - id: M2
    column: must
    text: Recovery concepts exist for relevant IT services.
  - id: S1
    column: should
    text: A backup and recovery concept exists for each relevant IT service. Dependencies between IT services and the sequence for recovery are considered.
  - id: H1
    column: high
    text: Backup and recovery concepts are methodically reviewed at regular intervals. (A)
  - id: H2
    column: high
    text: General restore capability is considered and tested (e.g., sample testing, test systems). (I, A)
  - id: H3
    column: high
    text: "Backup and recovery concepts exist. (A)\nThe following aspects are considered: \n  - Recovery Point Objective (RPO),\n  - Recovery Time Objective (RTO).\n  - Required resources for recovery (considering capacity and performance incl. personnel and hardware),\n  - Avoidance of overload scenarios during recovery,\n  - Appropriate spatial redundancy (e.g., separate room, separate fire  section, separate data center, separate site)."
  - id: V1
    column: very high
    text: (Additional) Backups are performed via offline procedures, immutable backups or by using an isolated IAM solution. (I, A)
  - id: V2
    column: very high
    text: Restore procedures are technically tested in a methodical way at regular intervals. (I, A)
  - id: V3
    column: very high
    text: Geographical redundancy is considered in data backup and recovery concepts. (A)
