controls:
- id: 1.1.1
  question: Inwieweit sind Richtlinien zur Informationssicherheit vorhanden?
  iso_27001: 'ISO 27001:2022: A.5.1'
  requirements:
  - id: M1
    column: must
    text: Die Anforderungen an die Informationssicherheit wurden festgelegt, dokumentiert und an die Ziele der Organisation angepasst.
  - id: M2
    column: must
    text: Es gibt eine Richtlinie, die von der Geschäftsleitung der Organisation genehmigt wurde.
  - id: M3
    column: must
    text: Die Richtlinie enthält Ziele und beschreibt die Bedeutung der Informationssicherheit innerhalb der Organisation.
  - id: M4
    column: must
    text: Die Richtlinien werden den Mitarbeitern in geeigneter Form (z. B. über das Intranet) zur Verfügung gestellt.
  - id: M5
    column: must
    text: Mitarbeiter und externe Geschäftspartner werden über alle für sie relevanten Änderungen informiert.
  - id: S1
    column: should
    text: Die Anforderungen an die Informationssicherheit auf der Grundlage der Organisationsstrategie, Gesetzen und Verträgen sind in der Richtlinie berücksichtigt.
  - id: S2
    column: should
    text: Die Richtlinie weist auf Konsequenzen bei Nichtbeachtung hin.
  - id: S3
    column: should
    text: Weitere relevante Sicherheitsrichtlinien sind erstellt.
  - id: S4
    column: should
    text: Eine regelmäßige Prüfung und, falls notwendig, Überarbeitung der Richtlinien sind etabliert.
- id: 1.6.1
  question: Inwieweit werden für die Informationssicherheit relevante Ereignisse oder Beobachtungen gemeldet?
  iso_27001: 'ISO 27001:2022: A.5.24, A.6.8'
  requirements:
  - id: M1
    column: must
    text: "Es gibt eine Definition für ein meldepflichtiges Sicherheitsereignis oder eine meldepflichtige Beobachtung, die den Mitarbeitern und allen relevanten Stakeholdern bekannt ist.\nDie folgenden Aspekte werden berücksichtigt:\n  - Ereignisse und Beobachtungen in Bezug auf das Personal\n  - Ereignisse und Beobachtungen in Bezug auf die physische Sicherheit \n     (z. B. Einbruch, Diebstahl, unbefugter Zugang zu Sicherheitszonen, \n     Schwachstellen in den Sicherheitszonen)\n  - Ereignisse und Beobachtungen in Bezug auf die IT und Cybersicherheit \n    (z. B. anfällige IT-Systeme mit Schwachstellen, erkannte erfolgreiche oder nicht erfolgreiche Angriffe)\n  - Ereignisse und Beobachtungen in Bezug auf Lieferanten und andere Geschäftspartner (z. B. alle Vorfälle, die sich negativ auf die Sicherheit der eigenen Organisation auswirken können)"
  - id: M2
    column: must
    text: Es sind angemessene Mechanismen für die Meldung von Sicherheitsereignissen auf der Grundlage wahrgenommener Risiken festgelegt, umgesetzt und allen Mitarbeitern bekannt,
  - id: M3
    column: must
    text: Es sind geeignete Kommunikationskanäle für Meldende vorhanden.
  - id: S1
    column: should
    text: Es existiert eine zentrale Anlaufstelle für die Meldung von Vorfällen.
  - id: S2
    column: should
    text: Je nach dem wahrgenommenen Schweregrad stehen unterschiedliche Meldewege zur Verfügung (d. h. Echtzeitkommunikation für signifikante Ereignisse/Notfälle zusätzlich zu asynchronen Mechanismen wie Tickets oder E-Mail).
  - id: S3
    column: should
    text: Mitarbeiter sind verpflichtet und geschult, relevante Ereignisse zu melden.
  - id: S4
    column: should
    text: "Meldungen von Sicherheitsereignissen können ebenfalls durch organisationsfremde Stellen übermittelt werden. Die folgenden Aspekte werden berücksichtigt:\n  - Es besteht eine extern zugängliche Möglichkeit, Sicherheitsereignisse zu melden und ist kommuniziert bzw. bekannt,\n  - Die Reaktion auf Sicherheitsereignis-Meldungen von organisationsfremden Stellen ist definiert."
  - id: S5
    column: should
    text: Alle relevanten Meldenden haben Zugriff auf Mechanismen und Informationen zum Melden von Vorfällen.
  - id: S6
    column: should
    text: Ein Rückmeldeverfahren an die Meldenden ist etabliert.
  - id: V1
    column: very high
    text: Es werden regelmäßig Tests und Übungen bezüglich der Meldung von Sicherheitsereignissen und -beobachtungen durchgeführt. (C, I, A)
- id: 1.6.2
  question: Inwieweit werden gemeldete Sicherheitsereignisse verwaltet?
  iso_27001: 'ISO 27001:2022: A.5.24-27'
  requirements:
  - id: M1
    column: must
    text: Gemeldete Ereignisse werden unverzüglich bearbeitet.
  - id: M2
    column: must
    text: Eine angemessene Reaktion auf gemeldete Sicherheitsereignisse ist sichergestellt.
  - id: M3
    column: must
    text: Diesbezüglich gewonnene Erfahrungen werden in die kontinuierliche Verbesserung einbezogen.
  - id: S1
    column: should
    text: Während der Bearbeitung werden gemeldete Ereignisse kategorisiert (z. B. nach der Verantwortung in Personal, physische- und Cybersicherheit betreffende Ereignisse), qualifiziert (z. B. nicht sicherheitsrelevant, Beobachtung, vorgeschlagene Sicherheitsverbesserung, Sicherheitsschwachstelle, Sicherheitsvorfall) und priorisiert (z. B. niedriger, mittlerer, hoher, kritischer Schweregrad).
  - id: S2
    column: should
    text: "Verantwortlichkeiten für den Umgang mit Ereignissen werden anhand ihrer Kategorie definiert und zugewiesen. Die folgenden Aspekte werden berücksichtigt:\n  - Koordinierung von Vorfällen und Schwachstellen über mehrere Kategorien\n  - Qualifikation und Ressourcen\n  - Kommunikationsmethoden je nach Art und Priorität\n(z. B. nicht zeitkritische Kommunikation, zeitkritische Kommunikation, Notfallkommunikation)\n  - Abwesenheitsmanagement"
  - id: S3
    column: should
    text: Es existiert eine Strategie zur Meldung potenziell strafrechtlicher Aspekte von Sicherheitsvorfällen an die zuständigen Behörden, sofern dies notwendig oder angemessen ist. (C, I, A).
  - id: H1
    column: high
    text: Auf der Grundlage von Klasse, Kategorie und Schweregrad sind die maximalen Reaktionszeiten definiert. (C, I, A)
  - id: H2
    column: high
    text: "Ereignisse, die nicht entsprechend ihrer Priorität angemessen bearbeitet wurden, werden eskaliert. Die folgenden Aspekte werden berücksichtigt: (C, I, A)\n - Es sind Bedingungen und Schwellenwerte, wie z. B. maximale Reaktionszeiten, bevor eskaliert wird definiert,\n - Mechanismen, Prozesse und Kontakte für die Eskalation sind festgelegt,\n - Eskalationswege bis zur obersten Leitung der Organisation sind definiert."
  - id: H3
    column: high
    text: Gesetzliche, regulatorische und vertragliche Meldepflichten und entsprechende Kontaktinformationen sind bekannt. (C, I, A)
  - id: H4
    column: high
    text: "Eine Kommunikationsstrategie für sicherheitsrelevante Ereignisse ist vorhanden. Die folgenden Aspekte werden berücksichtigt: (C, I, A)\n - Mit wem zu kommunizieren ist (z. B. Gesellschafter, betroffene Geschäftspartner und Kunden, weitere Gesellschafter, Öffentlichkeit),\n - Wann zu kommunizieren ist,\n - Verantwortlichkeiten für die Kommunikation,\n - Autorisierung und Freigabe der Kommunikation,\n - Gesetzliche und regulatorische Einschränkungen der Kommunikation, \n - Was zu kommunizieren ist (z. B. vorbereitete Vorlagen und Bausteine für bestimmte Szenarien),\n - Wie zu kommunizieren ist (z. B. Kommunikationskanäle)."
  - id: H5
    column: high
    text: "Verfahren zur Reaktion auf Sicherheitsvorfälle bei Lieferanten sind etabliert. Die folgenden Aspekte werden berücksichtigt:  (C, I, A)\n - Analyse der Auswirkungen auf die eigene Organisation und Abrufen entsprechender interner Mechanismen,\n - Die Notwendigkeit zur Berichterstattung entsprechend den eigenen Meldeverfahren."
  - id: V1
    column: very high
    text: "Der Umgang mit Ereignissen unterschiedlicher Kategorien und verschiedener Prioritäten wird regelmäßig geprüft. (A)\n  - Übung oder Simulation von selten vorkommenden Kategorien und Prioritäten,\n  - Übungen oder Simulationen beinhalten Eskalationsmechanismen."
- id: 2.1.3
  question: Inwieweit werden Mitarbeiter hinsichtlich der Risiken beim Umgang mit Informationen geschult und sensibilisiert?
  iso_27001: 'ISO 27001:2022: 7.2,7.3, A.6.3'
  requirements:
  - id: M1
    column: must
    text: Mitarbeiter sind geschult und sensibilisiert.
  - id: S1
    column: should
    text: "Ein Konzept zur Sensibilisierung und Schulung der Mitarbeiter ist erstellt. Die folgenden Aspekte sind berücksichtigt:\n  - Richtlinie zur Informationssicherheit,\n  - Meldungen von Informationssicherheitsereignissen,\n  - Verhalten bei Auftreten von Schadsoftware,\n  - Richtlinien zu Benutzerkonten und Anmeldeinformationen (z. B. Passwort-Richtlinie),\n  - Compliance-Themen der Informationssicherheit,\n  - Anforderungen und Verfahren zum Einsatz von Geheimhaltungsvereinbarungen bei der gemeinsamen Nutzung schutzbedürftiger Informationen,\n  - Nutzung organisationsfremder IT-Dienste."
  - id: S2
    column: should
    text: Zielgruppen für Schulungs- und Sensibilisierungsmaßnahmen (d. h. Personen, die in bestimmten Risikoumgebungen tätig sind, wie z. B. Führungskräfte einschließlich Organisationsleiter, Administratoren, Mitarbeiter mit Zugriff auf Kundennetzwerke sowie Personal in Produktionsbereichen) werden identifiziert und in einem Schulungskonzept berücksichtigt.
  - id: S3
    column: should
    text: Das Konzept wurde vom verantwortlichen Management freigegeben.
  - id: S4
    column: should
    text: Schulungs- und Sensibilisierungsmaßnahmen werden sowohl in regelmäßigen Abständen als auch als Reaktion auf Ereignisse durchgeführt.
  - id: S5
    column: should
    text: Die Teilnahme an Schulungs- und Sensibilisierungsmaßnahmen wird dokumentiert.
  - id: S6
    column: should
    text: Mitarbeitern sind die Ansprechpartner für Informationssicherheit bekannt.
- id: 4.1.2
  question: Inwieweit wird der Zugang von Benutzern zu IT-Diensten und IT-Systemen gesichert?
  iso_27001: 'ISO 27001:2022: A.5.15, A.8.5'
  requirements:
  - id: M1
    column: must
    text: Die Auswahl der Verfahren zur Benutzerauthentifizierung wird auf Basis einer Risikobewertung getroffen. Mögliche Angriffsszenarien werden berücksichtigt (z. B. direkte Zugänglichkeit über das Internet).
  - id: M2
    column: must
    text: Die Authentifizierungsverfahren entsprechen den anerkannten Best Practices im Bereich Sicherheit.
  - id: S1
    column: should
    text: Die Verfahren zur Benutzerauthentifizierung werden auf der Grundlage der geschäftsbezogenen und sicherheitsrelevanten Anforderungen festgelegt und umgesetzt.
  - id: S2
    column: should
    text: Benutzer werden mindestens mittels starker Passwörter entsprechend dem aktuellen Stand der Technik authentifiziert.
  - id: S3
    column: should
    text: Es werden höherwertige Verfahren zur Authentifizierung von privilegierten Benutzerkonten angewendet (z. B. Privilegiertes Zugangsmanagement, 2-Faktor-Authentifizierung).
  - id: H1
    column: high
    text: Abhängig von der Risikobewertung werden die Authentifizierungsverfahren und die Zugriffskontrolle durch ergänzende Maßnahmen verstärkt (z. B. dauerhafte Zugriffsüberwachung hinsichtlich Unregelmäßigkeiten oder Einsatz einer starken Authentifizierung, automatische Abmeldung, Sperrung bei Inaktivität oder Schutz vor Brute-Force-Angriffen). (C, I, A)
  - id: V1
    column: very high
    text: Bevor Benutzer Zugriff auf Daten mit sehr hohem Schutzbedarf erhalten, werden sie durch starke Authentifizierung  (z. B. 2-Faktor-Authentifizierung) authentifiziert. (C, I)
- id: 4.1.3
  question: Inwieweit werden Benutzerkonten und Anmeldeinformationen sicher verwaltet und angewendet?
  iso_27001: 'ISO 27001:2022: A.5.16, A.5.17, A.5.18, A.8.9'
  requirements:
  - id: M1
    column: must
    text: Die Erstellung, Änderung und Löschung von Benutzerkonten wird durchgeführt.
  - id: M2
    column: must
    text: Es werden eindeutige und personalisierte Benutzerkonten verwendet.
  - id: M3
    column: must
    text: Die Nutzung von „Sammel-Konten“ ist geregelt (z. B. auf Fälle beschränkt, bei denen die Rückverfolgbarkeit von Aktionen verzichtbar ist).
  - id: M4
    column: must
    text: Benutzerkonten werden unmittelbar nachdem der Benutzer aus der Organisation ausgeschieden ist oder diese verlassen hat (z. B. bei Beendigung des Arbeitsverhältnisses) gesperrt.
  - id: M5
    column: must
    text: Benutzerkonten werden in regelmäßigen Abständen überprüft.
  - id: M6
    column: must
    text: Es erfolgt eine sichere Zustellung der Anmeldeinformationen an den Benutzer.
  - id: M7
    column: must
    text: "Eine Richtlinie zum Umgang mit Anmeldeinformationen ist definiert und umgesetzt. Die folgenden Aspekte werden berücksichtigt:\n  - Keine Weitergabe von Anmeldedaten, auch nicht an Personen in leitender Position, im Rahmen der geltenden Gesetze,\n  - kein Notieren von Anmeldeinformationen oder unverschlüsselte Speicherung\n  - sofortige Änderung der Anmeldeinformation bei Verdacht auf mögliche Kompromittierung\n  - keine Verwendung von identischen Anmeldeinformationen für geschäftliche und nicht-geschäftliche Nutzung\n  - Änderung von temporären oder Initial-Anmeldeinformationen nach dem 1. Login\n  - Vorgaben für die Qualität von Anmeldeinformationen (z. B. Passwort-Länge, zu verwendende Zeichenarten)."
  - id: S1
    column: should
    text: Ein Basis-Benutzerprofil mit minimalen Zugriffsrechten und Funktionalitäten ist vorhanden und wird angewendet.
  - id: S2
    column: should
    text: Herstellerseitig vorgegebene Standardkonten und -Passwörter werden deaktiviert (z. B. durch Sperrung oder Änderung des Passworts).
  - id: S3
    column: should
    text: Die Einrichtung von Benutzerkonten erfolgt durch die verantwortliche Stelle oder wird durch diese autorisiert.
  - id: S4
    column: should
    text: Die Einrichtung von Benutzerkonten unterliegt einem Genehmigungsprozess (4-Augen-Prinzip).
  - id: S5
    column: should
    text: Benutzerkonten von Dienstleistern werden nach Abschluss von deren Aufgabe gesperrt.
  - id: S6
    column: should
    text: Sperr- und Löschfristen für Benutzerkonten sind definiert.
  - id: S7
    column: should
    text: Die Verwendung von Standard-Passworten wird technisch verhindert.
  - id: S8
    column: should
    text: Beim Einsatz einer starken Authentifizierung wird das Medium (z. B. Faktor Besitz) sicher verwendet.
  - id: S9
    column: should
    text: Es findet eine Überprüfung der Benutzerkonten in regelmäßigen Abständen statt. Dazu gehören auch Benutzerkonten in IT-Systemen von Kunden.
  - id: S10
    column: should
    text: Die interaktive Anmeldung bei Dienstkonten (technischen Konten) wird technisch verhindert.
- id: 4.2.1
  question: Inwieweit werden Zugriffsrechte vergeben und verwaltet?
  iso_27001: 'ISO 27001:2022: A.5.18'
  requirements:
  - id: M1
    column: must
    text: "Die Anforderungen an das Management von Zugriffsrechten (Autorisierung) sind ermittelt und erfüllt. Die folgenden Aspekte werden berücksichtigt:\n  - Verfahren zur Beantragung, Verifizierung und Genehmigung,\n  - Anwendung des Minimal- („Need-to-know\" / “Least-Privilege“)-Prinzips.\n  - Zugriffsrechte werden widerrufen, wenn sie nicht mehr benötigt werden"
  - id: M2
    column: must
    text: Die erteilten Zugriffsrechte für normale und privilegierte Benutzerkonten sowie technische Konten werden in regelmäßigen Abständen auch in IT-Systemen von Kunden überprüft.
  - id: S1
    column: should
    text: Berechtigungskonzepte für den Zugriff auf Informationen sind erstellt.
  - id: S2
    column: should
    text: Berechtigungs-Rollen werden verwendet.
  - id: S3
    column: should
    text: Die Vergabe von Rechten erfolgt bedarfsorientiert und entsprechend der Rolle und/oder dem Verantwortungsbereich.
  - id: S4
    column: should
    text: Normalen Benutzerkonten werden keine privilegierten Zugriffsrechte erteilt.
  - id: S5
    column: should
    text: Die Zugriffsrechte eines Benutzers werden aktualisiert, sobald sich dessen Aufgabenbereich geändert hat (z. B. Wechsel in einen anderen Zuständigkeitsbereich).
  - id: H1
    column: high
    text: Die Zugriffsrechte sind durch den internen Informationsverantwortlichen freigegeben. (C, I, A)
  - id: V1
    column: very high
    text: Informationen werden auf Inhaltsebene (z. B. auf Dateiebene) in verschlüsselter Form gespeichert, um zu verhindern, dass Unbefugte Zugriff auf die Informationen erhalten (privilegierte Benutzer). Ist eine Verschlüsselung nicht möglich, sind die Informationen durch gleichwertige Maßnahmen zu schützen. (C)
  - id: V2
    column: very high
    text: Bestehende Zugriffsrechte werden in kürzeren Abständen regelmäßig überprüft (z. B. vierteljährlich) (C)
- id: 5.1.1
  question: Inwieweit wird die Nutzung kryptografischer Verfahren verwaltet?
  iso_27001: 'ISO 27001:2022: A.8.24'
  requirements:
  - id: M1
    column: must
    text: Alle angewendeten kryptografischen Verfahren (z. B. Verschlüsselung, Signatur und Hash-Algorithmen, Protokolle) bieten die für das jeweilige Anwendungsgebiet notwendige Sicherheit entsprechend der anerkannten Industrienorm, soweit rechtlich möglich.
  - id: S1
    column: should
    text: "Ein Konzept für den Einsatz von Kryptografie ist definiert und umgesetzt. Die folgenden Aspekte werden berücksichtigt:\n  - Kryptografische Verfahren, \n  - Schlüsselstärken,\n  - Verfahren für den vollständigen Lebenszyklus von kryptografischen Schlüsseln einschließlich Erzeugung, Speicherung, Archivierung, Abruf, Verteilung, Deaktivierung, Erneuerung und Löschung."
  - id: H1
    column: high
    text: Anforderungen an die Schlüsselhoheit (insbesondere bei organisationsfremder Verarbeitung) werden festgelegt und erfüllt. (C, I)
- id: 5.1.2
  question: Inwieweit werden Informationen während der Übertragung geschützt?
  iso_27001: 'ISO 27001:2022: A.5.14'
  requirements:
  - id: M1
    column: must
    text: Die zur Übertragung von Informationen genutzten Netzwerkdienste sind identifiziert und dokumentiert.
  - id: M2
    column: must
    text: Richtlinien und Verfahren entsprechend den Klassifizierungsvorgaben zur Nutzung von Netzwerkdiensten sind definiert und umgesetzt.
  - id: M3
    column: must
    text: Maßnahmen zum Schutz von übertragenen Inhalten vor unberechtigtem Zugriff sind umgesetzt.
  - id: S1
    column: should
    text: Maßnahmen zur Sicherstellung der korrekten Adressierung und des korrekten Transports von Informationen sind umgesetzt.
  - id: S2
    column: should
    text: Der elektronische Informationsaustausch erfolgt entsprechend der jeweiligen Klassifizierung durch Inhalts- oder Transportverschlüsselung.
  - id: S3
    column: should
    text: "Fernzugriffsverbindungen zum Unternehmensnetzwerk verfügen über angemessene Sicherheitsfunktionen. Die folgenden Aspekte werden berücksichtigt: \n  - Verschlüsselung,\n  - Authentifizierungsstärke,\n  - Gewähren und Beenden des Zugriffs,\n  - Nutzung einer sicheren Verbindung (z. B. VPN)."
  - id: H1
    column: high
    text: Informationen werden in verschlüsselter Form (mindestens Transportverschlüsselung) übertragen oder durch gleichwertige Maßnahmen geschützt. (C)
  - id: V1
    column: very high
    text: Informationen werden inhaltsverschlüsselt transportiert oder übertragen. (C)
- id: 5.2.4
  question: Inwieweit werden Ereignisprotokolle aufgezeichnet und analysiert?
  iso_27001: 'ISO 27001:2022: A.5.17, A.8.15'
  requirements:
  - id: M1
    column: must
    text: Anforderungen an die Informationssicherheit bezüglich der Handhabung von Ereignisprotokollen sind ermittelt und erfüllt.
  - id: M2
    column: must
    text: Sicherheitsrelevante Anforderungen an die Protokollierung der Aktivitäten von Systemadministratoren und Nutzern sind ermittelt, festgelegt und erfüllt.
  - id: M3
    column: must
    text: Die eingesetzten IT-Systeme werden hinsichtlich der Notwendigkeit der Protokollierung bewertet.
  - id: M4
    column: must
    text: Bei der Nutzung organisationsfremder IT-Dienste werden Informationen zu den Überwachungsmöglichkeiten eingeholt und in der Bewertungberücksichtigt.
  - id: M5
    column: must
    text: Ereignisprotokolle werden, soweit im Einklang mit den zulässigen gesetzlichen und betrieblichen Bestimmungen, regelmäßig auf Regelverstöße und Auffälligkeiten überprüft.
  - id: S1
    column: should
    text: Ein Verfahren zur Eskalation von relevanten Ereignissen an die zuständige Stelle (z. B. Sicherheitsvorfall-Meldung, Datenschutz, Unternehmenssicherheit, IT-Sicherheit) ist definiert und etabliert.
  - id: S2
    column: should
    text: Ereignisprotokolle (Inhalte und Metadaten) sind gegen Änderungen geschützt. (z. B. durch eine dedizierte Umgebung).
  - id: S3
    column: should
    text: Eine angemessene Überwachung und Aufzeichnung aller informationssicherheitsrelevanten Aktionen im Netzwerk sind etabliert.
  - id: H1
    column: high
    text: Informationssicherheitsanforderungen, die für die Sicherheit während der Handhabung von Ereignisprotokollen relevant sind, z. B. vertragliche Anforderungen, sind ermittelt und umgesetzt. (C, I, A)
  - id: H2
    column: high
    text: Zugriffe beim Auf- und Abbau von organisationsfremden Netzwerkverbindungen (z. B. Fernwartung) werden protokolliert. (C, I, A)
  - id: V1
    column: very high
    text: Zugriffe auf Daten mit sehr hohem Schutzbedarf werden protokolliert, soweit dies technisch möglich und im Rahmen der gesetzlichen und betrieblichen Bestimmungen zulässig ist. (C, I)
- id: 5.2.5
  question: Inwieweit werden Schwachstellen erkannt und behandelt?
  iso_27001: 'ISO 27001:2022: A.8.8, A.8.19'
  requirements:
  - id: M1
    column: must
    text: 'Es werden Informationen zu technischen Schwachstellen der eingesetzten IT-Systeme gesammelt (z. B. Informationen des Herstellers, Systemaudits, CVE-Datenbank) und bewertet (z. B. Allgemeines Bewertungssystem für Schwachstellen, en: Common Vulnerability Scoring System, CVSS)'
  - id: M2
    column: must
    text: Potenziell betroffene IT-Systeme und Software werden identifiziert und bewertet.
  - id: M3
    column: must
    text: Aus Schwachstellen resultierende Risiken werden behandelt.
  - id: S1
    column: should
    text: Ein angemessenes Patch-Management ist definiert und umgesetzt (z. B. Prüfung und Installation von Patches).
  - id: S2
    column: should
    text: Bei Bedarf werden Maßnahmen zur Risikominimierung umgesetzt.
  - id: S3
    column: should
    text: Die erfolgreiche Installation von Patches ist in geeigneter Weise verifiziert.
- id: 5.2.9
  question: Inwieweit wird die Sicherung und Wiederherstellung von Daten und IT-Diensten sichergestellt?
  iso_27001: 'ISO 27001:2022: A.8.13'
  requirements:
  - id: M1
    column: must
    text: Für die maßgeblichen IT-Systeme sind Datensicherungs-Konzepte vorhanden. Es werden geeignete Schutzmaßnahmen zur Gewährleistung der Vertraulichkeit, Integrität und Verfügbarkeit der Datensicherungen berücksichtigt.
  - id: M2
    column: must
    text: Für die maßgeblichen IT-Dienste liegen Wiederherstellungs-Konzepte vor.
  - id: S1
    column: should
    text: Für jeden maßgeblichen IT-Dienst ist ein Sicherungs- und Wiederherstellungs-Konzept vorhanden. Dabei werden die Abhängigkeiten zwischen den IT-Diensten sowie die Reihenfolge der Wiederherstellung berücksichtigt.
  - id: H1
    column: high
    text: Sicherungs- und Wiederherstellungskonzepte werden in regelmäßigen Abständen methodisch überprüft. (A)
  - id: H2
    column: high
    text: Die allgemeine Wiederherstellungskapazität wird berücksichtigt und geprüft (z. B. Stichprobenprüfung, Testsysteme). (I, A)
  - id: H3
    column: high
    text: "Es liegen Konzepte für Datensicherung und Wiederherstellung vor. (A)\nDie folgenden Aspekte werden berücksichtigt:\n  - Recovery Point Objective (RPO),\n  - Recovery Time Objective (RTO),\n  - Erforderliche Ressourcen für die Wiederherstellung (unter Berücksichtigung von Kapazität und Leistung, einschließlich Personal und Hardware),\n  - Vermeidung von Überlastungsszenarien während der Wiederherstellung,\n  - Angemessene räumliche Redundanz (z. B. separater Raum, separater Brandabschnitt, separates Rechenzentrum, separater Standort)."
  - id: V1
    column: very high
    text: (Zusätzliche) Sicherungen werden über Offline-Verfahren, unveränderliche Sicherungen (immutable backups) oder durch Anwendung einer isolierten IAM-Lösung durchgeführt. (I, A)
  - id: V2
    column: very high
    text: Wiederherstellungsverfahren werden in regelmäßigen Abständen systematisch technisch geprüft. (I, A)
  - id: V3
    column: very high
    text: Geografische Redundanz wird in Daten-Backup- und Wiederherstellungskonzepten berücksichtigt. (A)
